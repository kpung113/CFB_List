<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Starkville Visit Planner</title>

  <!-- Shared Navigation Script -->
  <script src="nav.js"></script>

  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-8695308WQ8"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-8695308WQ8');

    if (localStorage.getItem('dyslexiaMode') === 'enabled') {
      document.documentElement.classList.add('dyslexia-font');
    }
  </script>

  <style>
    :root {
      --bg: #0b0c10;
      --card-bg: #181920;
      --card-border: #272935;
      --text: #f8fafc;
      --accent-maroon: #5d1725;
      --subtext: #94a3b8;
      --gold: #84cc16;
      --green: #22c55e;
    }
    * { box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 16px;
    }
    body.dyslexia-font, body.dyslexia-font * {
      font-family: "Comic Sans MS", "Verdana", sans-serif !important;
      letter-spacing: 0.05em !important;
      word-spacing: 0.1em !important;
    }
    .dyslexia-toggle {
      background: #181920;
      border: 1px solid var(--card-border);
      color: #38bdf8;
      font-size: 0.75rem;
      font-weight: 700;
      padding: 5px 10px;
      border-radius: 6px;
      cursor: pointer;
    }

    /* --- NAVIGATION DRAWER STYLES --- */
    .nav-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.6);
      z-index: 99;
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transition: 0.2s;
    }
    .nav-overlay.open {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
    }
    .nav-drawer {
      position: fixed;
      top: 0;
      left: -260px;
      width: 260px;
      height: 100vh;
      background: #181920;
      border-right: 1px solid var(--card-border);
      z-index: 100;
      display: flex;
      flex-direction: column;
      transition: 0.3s;
      box-shadow: 4px 0 15px rgba(0, 0, 0, 0.5);
    }
    .nav-drawer.open { left: 0; }
    .drawer-header {
      padding: 14px 16px;
      font-weight: 800;
      font-size: 0.9rem;
      text-transform: uppercase;
      color: #38bdf8;
      border-bottom: 1px solid var(--card-border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .drawer-close {
      background: none;
      border: none;
      color: var(--subtext);
      font-size: 1.3rem;
      cursor: pointer;
    }
    .drawer-links {
      list-style: none;
      padding: 8px 0;
      margin: 0;
      display: flex;
      flex-direction: column;
    }
    .drawer-links a {
      padding: 12px 18px;
      color: var(--text);
      text-decoration: none;
      font-size: 0.85rem;
      font-weight: 700;
      display: block;
      border-left: 3px solid transparent;
    }
    .drawer-links a:hover, .drawer-links a.active {
      background-color: #222530;
      border-left-color: #38bdf8;
      color: #38bdf8;
    }

    /* --- HEADER STYLES --- */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 20px;
      padding-bottom: 12px;
      border-bottom: 2px solid var(--accent-maroon);
    }
    .header-left, .header-right, .header-title {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .header-left { gap: 12px; }
    .menu-btn {
      background: none;
      border: none;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      width: 22px;
      height: 18px;
      padding: 0;
      z-index: 101;
    }
    .menu-btn span {
      display: block;
      width: 100%;
      height: 2px;
      background-color: #38bdf8;
      border-radius: 2px;
    }
    .msu-logo {
      height: 38px;
      width: auto;
      object-fit: contain;
      filter: drop-shadow(0 0 2px #fff);
    }
    h1 { margin: 0; font-size: 1.25rem; font-weight: 800; }

    /* Filter Controls */
    .filter-panel {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .filter-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
      font-size: 0.8rem;
    }
    .filter-label {
      font-weight: 700;
      color: var(--gold);
      min-width: 110px;
    }
    .days-input-wrapper {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    input[type="number"] {
      background: #12131a;
      color: #fff;
      border: 1px solid var(--card-border);
      border-radius: 6px;
      padding: 4px 8px;
      width: 50px;
      font-weight: bold;
      text-align: center;
      font-size: 0.85rem;
    }
    .sports-toggles {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }
    .sports-toggles label {
      background: #12131a;
      border: 1px solid var(--card-border);
      padding: 4px 8px;
      border-radius: 6px;
      cursor: pointer;
      user-select: none;
      font-size: 0.75rem;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .sports-toggles input:checked + span {
      color: #fff;
      font-weight: bold;
    }
    .search-btn {
      background: var(--accent-maroon);
      color: #fff;
      border: 1px solid #7d2033;
      padding: 6px 14px;
      border-radius: 6px;
      font-weight: 800;
      font-size: 0.8rem;
      cursor: pointer;
      align-self: flex-start;
      margin-top: 2px;
    }

    /* Candidate Cards */
    .candidate-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      padding: 10px 12px;
      margin-bottom: 8px;
      border-left: 4px solid var(--accent-maroon);
    }
    .candidate-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
      padding-bottom: 4px;
      border-bottom: 1px solid #222530;
    }
    .date-range {
      font-weight: 800;
      font-size: 0.85rem;
      color: #fff;
    }
    .badge-group {
      display: flex;
      gap: 4px;
    }
    .badge {
      background: rgba(132, 204, 22, 0.15);
      color: var(--gold);
      font-size: 0.7rem;
      font-weight: bold;
      padding: 2px 6px;
      border-radius: 4px;
      border: 1px solid rgba(132, 204, 22, 0.3);
    }
    .badge-multi {
      background: rgba(34, 197, 94, 0.15);
      color: var(--green);
      border-color: rgba(34, 197, 94, 0.3);
    }
    .game-line {
      display: flex;
      justify-content: space-between;
      font-size: 0.75rem;
      padding: 3px 0;
      color: var(--subtext);
    }
    .sport-title {
      font-weight: 700;
      color: var(--text);
    }
  </style>
</head>
<body>

  <header>
    <div class="header-left">
      <button class="menu-btn" onclick="toggleMenu()" aria-label="Toggle Menu"><span></span><span></span><span></span></button>
      <div class="header-title">
        <img src="https://a.espncdn.com/combiner/i?img=/i/teamlogos/ncaa/500/344.png&h=100&w=100" alt="MSU Logo" class="msu-logo">
        <h1>Starkville Trip Planner</h1>
      </div>
    </div>
    <div class="header-right">
      <button id="fontToggleBtn" class="dyslexia-toggle" onclick="toggleDyslexiaFont()">Kate Button: OFF</button>
    </div>
  </header>

  <div class="filter-panel">
    <div class="filter-row">
      <span class="filter-label">Days in Starkville:</span>
      <div class="days-input-wrapper">
        <input type="number" id="trip-days" min="1" max="5" value="2">
        <span style="color:var(--subtext); font-size:0.75rem;">(1 to 5 days)</span>
      </div>
    </div>

    <div class="filter-row">
      <span class="filter-label">Sports Toggles:</span>
      <div class="sports-toggles">
        <label><input type="checkbox" value="football" checked> <span>🏈 Football</span></label>
        <label><input type="checkbox" value="mens-basketball" checked> <span>🏀 Men's BB</span></label>
        <label><input type="checkbox" value="womens-basketball" checked> <span>🏀 Women's BB</span></label>
        <label><input type="checkbox" value="baseball" checked> <span>⚾ Baseball</span></label>
        <label><input type="checkbox" value="softball" checked> <span>🥎 Softball</span></label>
      </div>
    </div>

    <button class="search-btn" onclick="calculateHomestands()">Search Best Dates</button>
  </div>

  <div id="results-container">Scanning schedules...</div>

  <!-- Include centralized dataset -->
  <script src="data.js"></script>

  <script>
    function updateToggleButtonState() {
      const btn = document.getElementById('fontToggleBtn');
      if (!btn) return;
      const active = localStorage.getItem('dyslexiaMode') === 'enabled';
      btn.innerText = active ? 'Kate Button: ON' : 'Kate Button: OFF';
      btn.style.borderColor = active ? '#38bdf8' : '#334155';
    }

    function toggleDyslexiaFont() {
      const active = localStorage.getItem('dyslexiaMode') === 'enabled';
      localStorage.setItem('dyslexiaMode', active ? 'disabled' : 'enabled');
      document.body.classList.toggle('dyslexia-font', !active);
      document.documentElement.classList.toggle('dyslexia-font', !active);
      updateToggleButtonState();
    }

    const sportLabels = {
      'football': '🏈 Football',
      'mens-basketball': '🏀 Men\'s Basketball',
      'womens-basketball': '🏀 Women\'s Basketball',
      'baseball': '⚾ Baseball',
      'softball': '🥎 Softball'
    };

    function calculateHomestands() {
      const container = document.getElementById("results-container");
      if (!container) return;
      container.innerHTML = "<p style='color:var(--subtext);'>Calculating homestand windows...</p>";

      if (typeof masterDataset === 'undefined' || !masterDataset.length) {
        container.innerHTML = "<p style='color:var(--subtext);'>Unable to load data from data.js.</p>";
        return;
      }

      const daysInput = document.getElementById("trip-days");
      let selectedDays = parseInt(daysInput.value);
      if (isNaN(selectedDays) || selectedDays < 1) selectedDays = 1;
      if (selectedDays > 5) selectedDays = 5;
      daysInput.value = selectedDays;

      const checkedSports = Array.from(document.querySelectorAll('.sports-toggles input:checked')).map(cb => cb.value);

      if (checkedSports.length === 0) {
        container.innerHTML = "<p style='color:var(--subtext);'>Please select at least one sport toggle.</p>";
        return;
      }

      const homeGames = masterDataset.filter(ev => ev.isHome && checkedSports.includes(ev.sportKey));

      if (homeGames.length === 0) {
        container.innerHTML = "<p style='color:var(--subtext);'>No home games found for selected filters.</p>";
        return;
      }

      homeGames.sort((a, b) => new Date(a.isoDate) - new Date(b.isoDate));

      const gamesByDate = {};
      homeGames.forEach(game => {
        if (!gamesByDate[game.isoDate]) gamesByDate[game.isoDate] = [];
        gamesByDate[game.isoDate].push(game);
      });

      const sortedIsoDates = Object.keys(gamesByDate).sort();
      const candidateWindows = [];

      for (let i = 0; i < sortedIsoDates.length; i++) {
        const startDate = new Date(sortedIsoDates[i] + 'T00:00:00');
        const windowEndDate = new Date(startDate);
        windowEndDate.setDate(startDate.getDate() + (selectedDays - 1));

        let windowGames = [];
        sortedIsoDates.forEach(dateStr => {
          const d = new Date(dateStr + 'T00:00:00');
          if (d >= startDate && d <= windowEndDate) {
            windowGames.push(...gamesByDate[dateStr]);
          }
        });

        if (windowGames.length >= 2) {
          const sportsSet = new Set(windowGames.map(g => g.sportKey));
          candidateWindows.push({
            startDate,
            windowEndDate,
            games: windowGames,
            sportCount: sportsSet.size
          });
        }
      }

      const uniqueCandidates = [];
      const seenSignatures = new Set();

      candidateWindows.forEach(w => {
        const sig = w.games.map(g => g.isoDate + g.sportKey + g.opponent).join('|');
        if (!seenSignatures.has(sig)) {
          seenSignatures.add(sig);
          uniqueCandidates.push(w);
        }
      });

      renderCandidates(uniqueCandidates, selectedDays);
    }

    function renderCandidates(windows, tripDays) {
      const container = document.getElementById("results-container");
      container.innerHTML = "";

      if (windows.length === 0) {
        container.innerHTML = `<p style='color:var(--subtext);'>No multi-game homestands found for a ${tripDays}-day trip with current filters.</p>`;
        return;
      }

      windows.forEach(w => {
        const startLabel = w.startDate.toLocaleDateString('en-US', { month: 'short', day: 'numeric', weekday: 'short' });
        const endLabel = w.windowEndDate.toLocaleDateString('en-US', { month: 'short', day: 'numeric', weekday: 'short' });

        const dateHeaderStr = (tripDays === 1 || w.startDate.getTime() === w.windowEndDate.getTime())
          ? startLabel
          : `${startLabel} – ${endLabel}`;

        const card = document.createElement("div");
        card.className = "candidate-card";

        let gamesHtml = w.games.map(g => {
          const gameDate = new Date(g.isoDate + 'T00:00:00');
          const dayName = gameDate.toLocaleDateString('en-US', { weekday: 'short', month: 'numeric', day: 'numeric' });
          return `
            <div class="game-line">
              <span><strong class="sport-title">${sportLabels[g.sportKey]}</strong> vs ${g.opponent}</span>
              <span>${dayName} • ${g.timeStr}</span>
            </div>
          `;
        }).join('');

        const multiSportBadge = w.sportCount > 1 
          ? `<span class="badge badge-multi">${w.sportCount} Sports Crossover</span>` 
          : '';

        card.innerHTML = `
          <div class="candidate-header">
            <span class="date-range">${dateHeaderStr}</span>
            <div class="badge-group">
              ${multiSportBadge}
              <span class="badge">${w.games.length} Home Games</span>
            </div>
          </div>
          ${gamesHtml}
        `;

        container.appendChild(card);
      });
    }

    window.onload = function() {
      updateToggleButtonState();
      if (localStorage.getItem('dyslexiaMode') === 'enabled') document.body.classList.add('dyslexia-font');
      try {
        calculateHomestands();
      } catch (err) {
        const container = document.getElementById("results-container");
        if (container) container.innerHTML = "<p style='color:var(--subtext);'>Error calculating trip windows.</p>";
      }
    };
  </script>

</body>
</html>
