<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mississippi State Schedules</title>
  <style>
    :root {
      --bg: #0b0c10;
      --card-bg: #181920;
      --card-border: #272935;
      --text: #f8fafc;
      --accent-maroon: #5d1725;
      --subtext: #94a3b8;
      --gold: #fbbf24;
      --win-green: #22c55e;
      --loss-red: #ef4444;
    }
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 12px;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 10px;
      padding-bottom: 8px;
      border-bottom: 2px solid var(--accent-maroon);
    }
    .header-title {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .msu-logo {
      height: 32px;
      width: auto;
      object-fit: contain;
      filter: 
        drop-shadow( 2px  0px 0px #ffffff)
        drop-shadow(-2px  0px 0px #ffffff)
        drop-shadow( 0px  2px 0px #ffffff)
        drop-shadow( 0px -2px 0px #ffffff);
    }
    h1 { margin: 0; font-size: 1rem; font-weight: 800; letter-spacing: -0.5px; }
    .nav-tabs {
      display: flex;
      gap: 6px;
    }
    .nav-tabs a {
      color: var(--subtext);
      text-decoration: none;
      font-size: 0.75rem;
      font-weight: 700;
      padding: 4px 8px;
      background: #181920;
      border: 1px solid var(--card-border);
      border-radius: 6px;
      transition: all 0.2s;
    }
    .nav-tabs a.active, .nav-tabs a:hover {
      color: #fff;
      background: var(--accent-maroon);
      border-color: #7d2033;
    }

    /* Sport Filter Subheader */
    .sport-filter-bar {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding-bottom: 8px;
      margin-bottom: 12px;
      white-space: nowrap;
    }
    .sport-tab {
      background: #181920;
      border: 1px solid var(--card-border);
      color: var(--subtext);
      font-size: 0.75rem;
      font-weight: 700;
      padding: 5px 10px;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .sport-tab.active, .sport-tab:hover {
      background: var(--accent-maroon);
      color: #fff;
      border-color: #7d2033;
    }

    .schedule-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      padding: 8px 12px;
      margin-bottom: 6px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 2px 6px rgba(0,0,0,0.3);
    }
    .game-left {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .game-date {
      font-size: 0.7rem;
      color: var(--subtext);
      font-weight: 600;
    }
    .opponent-name {
      font-size: 0.9rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .game-right {
      text-align: right;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 2px;
    }
    .result-badge {
      font-weight: 800;
      font-size: 0.8rem;
      padding: 2px 6px;
      border-radius: 4px;
      display: inline-block;
    }
    .result-win { background: rgba(34, 197, 94, 0.2); color: var(--win-green); border: 1px solid rgba(34, 197, 94, 0.4); }
    .result-loss { background: rgba(239, 68, 68, 0.2); color: var(--loss-red); border: 1px solid rgba(239, 68, 68, 0.4); }
    .sport-tag {
      font-size: 0.65rem;
      color: var(--gold);
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
  </style>
</head>
<body>

  <header>
    <div class="header-title">
      <img src="https://a.espncdn.com/combiner/i?img=/i/teamlogos/ncaa/500/344.png&h=100&w=100" 
           alt="MSU Logo" 
           class="msu-logo">
      <h1>MSU Schedules</h1>
    </div>
    <nav class="nav-tabs">
      <a href="index.html">Scores</a>
      <a href="schedules.html" class="active">MSU Schedule</a>
      <a href="visit.html">MSU Trip</a>
    </nav>
  </header>

  <!-- Sport Filter Subheader -->
  <div class="sport-filter-bar">
    <button class="sport-tab active" onclick="filterSport('all', this)">All Sports</button>
    <button class="sport-tab" onclick="filterSport('football', this)">🏈 Football</button>
    <button class="sport-tab" onclick="filterSport('mens-basketball', this)">🏀 Men's BB</button>
    <button class="sport-tab" onclick="filterSport('womens-basketball', this)">🏀 Women's BB</button>
    <button class="sport-tab" onclick="filterSport('baseball', this)">⚾ Baseball</button>
    <button class="sport-tab" onclick="filterSport('softball', this)">🥎 Softball</button>
  </div>

  <div id="schedule-container">Loading schedules...</div>

  <script>
    const sportEndpoints = {
      'football': 'football/college-football',
      'mens-basketball': 'basketball/mens-college-basketball',
      'womens-basketball': 'basketball/womens-college-basketball',
      'baseball': 'baseball/college-baseball',
      'softball': 'softball/college-softball'
    };

    const sportLabels = {
      'football': 'Football',
      'mens-basketball': 'Men\'s Basketball',
      'womens-basketball': 'Women\'s Basketball',
      'baseball': 'Baseball',
      'softball': 'Softball'
    };

    // Fallback manual array for Spring 2027 Baseball/Softball home games
    const fallbackSpring2027Games = [
      { sportKey: 'baseball', opponent: 'Opening Weekend', isoDate: '2027-02-19', timeStr: '4:00 PM' },
      { sportKey: 'baseball', opponent: 'Opening Weekend', isoDate: '2027-02-20', timeStr: '2:00 PM' },
      { sportKey: 'baseball', opponent: 'Opening Weekend', isoDate: '2027-02-21', timeStr: '1:00 PM' },
      { sportKey: 'softball', opponent: 'Bulldog Invitational', isoDate: '2027-02-26', timeStr: '5:00 PM' },
      { sportKey: 'softball', opponent: 'Bulldog Invitational', isoDate: '2027-02-27', timeStr: '2:00 PM' },
      { sportKey: 'baseball', opponent: 'SEC Home Series', isoDate: '2027-03-19', timeStr: '6:30 PM' },
      { sportKey: 'baseball', opponent: 'SEC Home Series', isoDate: '2027-03-20', timeStr: '2:00 PM' },
      { sportKey: 'baseball', opponent: 'SEC Home Series', isoDate: '2027-03-21', timeStr: '1:00 PM' },
      { sportKey: 'softball', opponent: 'SEC Home Series', isoDate: '2027-03-26', timeStr: '6:00 PM' },
      { sportKey: 'softball', opponent: 'SEC Home Series', isoDate: '2027-03-27', timeStr: '2:00 PM' },
      { sportKey: 'baseball', opponent: 'SEC Home Series', isoDate: '2027-04-16', timeStr: '6:30 PM' },
      { sportKey: 'baseball', opponent: 'SEC Home Series', isoDate: '2027-04-17', timeStr: '2:00 PM' },
      { sportKey: 'baseball', opponent: 'SEC Home Series', isoDate: '2027-04-18', timeStr: '1:00 PM' }
    ];

    const completedFootballGamesMap = {
      "2026-09-05": { isWin: true, score: "62-13" },
      "2026-09-12": { isWin: true, score: "38-13" },
      "2026-09-19": { isWin: true, score: "41-34" },
      "2026-09-26": { isWin: true, score: "31-24" },
      "2026-10-03": { isWin: false, score: "23-56" }
    };

    let masterScheduleEvents = [];
    let currentFilter = 'all';

    async function fetchAllSchedules() {
      const container = document.getElementById("schedule-container");
      container.innerHTML = "<p style='color:var(--subtext);'>Loading multi-sport schedules...</p>";

      const sports = Object.keys(sportEndpoints);
      const seasons = [2026, 2027];
      let fetchTasks = [];

      sports.forEach(sportKey => {
        const path = sportEndpoints[sportKey];
        seasons.forEach(season => {
          const url = `https://site.api.espn.com/apis/site/v2/sports/${path}/teams/344/schedule?season=${season}`;
          fetchTasks.push(
            fetch(url)
              .then(r => r.json())
              .then(data => ({ sportKey, season, events: data.events || [] }))
              .catch(() => ({ sportKey, season, events: [] }))
          );
        });
      });

      try {
        const responses = await Promise.all(fetchTasks);
        masterScheduleEvents = [];
        let apiHas2027SpringData = false;

        responses.forEach(({ sportKey, season, events }) => {
          if (season === 2027 && (sportKey === 'baseball' || sportKey === 'softball') && events.length > 0) {
            apiHas2027SpringData = true;
          }

          events.forEach(event => {
            const comp = event.competitions && event.competitions[0];
            if (!comp) return;

            const msu = comp.competitors.find(c => String(c.id) === '344') || comp.competitors[0];
            const opp = comp.competitors.find(c => String(c.id) !== '344') || comp.competitors[1] || msu;

            const isHome = msu.homeAway === 'home';
            const statusState = (event.status && event.status.type) ? event.status.type.state : 'pre';
            const isCompletedApi = (event.status && event.status.type && event.status.type.completed) || statusState === 'post';

            const gameDate = new Date(event.date);
            const isoDate = event.date.split("T")[0];

            const isTimeValid = event.timeValid !== false;
            let timeStr = gameDate.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });
            if (!isTimeValid || timeStr === "12:00 AM") timeStr = "TBD";

            const oppTeam = opp.team || {};
            const oppName = oppTeam.shortDisplayName || oppTeam.displayName || oppTeam.name || "TBD";

            let oppRank = '';
            if (opp.curatedRank && opp.curatedRank.current && opp.curatedRank.current <= 25) {
              oppRank = `#${opp.curatedRank.current} `;
            }

            let resultHtml = '';
            const knownResult = (sportKey === 'football') ? completedFootballGamesMap[isoDate] : null;

            if (knownResult) {
              resultHtml = `<span class="result-badge ${knownResult.isWin ? 'result-win' : 'result-loss'}">${knownResult.isWin ? 'W' : 'L'} ${knownResult.score}</span>`;
            } else if (isCompletedApi || (msu.score && opp.score)) {
              const getScoreStr = (c) => {
                if (c.score && typeof c.score.value !== 'undefined') return String(c.score.value);
                if (c.score && c.score.displayValue) return String(c.score.displayValue);
                return "0";
              };
              const msuScoreNum = parseInt(getScoreStr(msu));
              const oppScoreNum = parseInt(getScoreStr(opp));
              const isWinner = msu.winner === true || (msuScoreNum > oppScoreNum);
              resultHtml = `<span class="result-badge ${isWinner ? 'result-win' : 'result-loss'}">${isWinner ? 'W' : 'L'} ${msuScoreNum}-${oppScoreNum}</span>`;
            } else {
              resultHtml = `<span class="game-date">${timeStr}</span>`;
            }

            masterScheduleEvents.push({
              sportKey,
              isHome,
              date: gameDate,
              dateFormatted: gameDate.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' }),
              matchupText: `${oppRank}${oppName}`,
              resultHtml
            });
          });
        });

        // Inject fallback if 2027 spring is blank
        if (!apiHas2027SpringData) {
          fallbackSpring2027Games.forEach(item => {
            const gameDate = new Date(item.isoDate + 'T14:00:00');
            masterScheduleEvents.push({
              sportKey: item.sportKey,
              isHome: true,
              date: gameDate,
              dateFormatted: gameDate.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' }),
              matchupText: item.opponent,
              resultHtml: `<span class="game-date">${item.timeStr}</span>`
            });
          });
        }

        // Sort chronologically
        masterScheduleEvents.sort((a, b) => a.date - b.date);

        renderSchedule();

      } catch (err) {
        container.innerHTML = "<p style='color:var(--subtext);'>Error loading schedules.</p>";
      }
    }

    function filterSport(sportKey, btnElement) {
      currentFilter = sportKey;
      document.querySelectorAll('.sport-tab').forEach(t => t.classList.remove('active'));
      btnElement.classList.add('active');
      renderSchedule();
    }

    function renderSchedule() {
      const container = document.getElementById("schedule-container");
      container.innerHTML = "";

      const filtered = masterScheduleEvents.filter(ev => {
        if (currentFilter === 'all') return true;
        return ev.sportKey === currentFilter;
      });

      if (filtered.length === 0) {
        container.innerHTML = "<p style='color:var(--subtext);'>No games found for this selection.</p>";
        return;
      }

      filtered.forEach(ev => {
        const card = document.createElement("div");
        card.className = "schedule-card";
        card.innerHTML = `
          <div class="game-left">
            <span class="sport-tag">${sportLabels[ev.sportKey]}</span>
            <span class="game-date">${ev.dateFormatted}</span>
            <div class="opponent-name">
              <span style="color:var(--subtext); font-size:0.75rem;">${ev.isHome ? 'vs' : '@'}</span>
              ${ev.matchupText}
            </div>
          </div>
          <div class="game-right">
            ${ev.resultHtml}
          </div>
        `;
        container.appendChild(card);
      });
    }

    fetchAllSchedules();
  </script>

</body>
</html>
