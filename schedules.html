<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mississippi State Schedule Tracker</title>
  
  <!-- Travel Data & Flight Utility Dependencies -->
  <script src="sec_airports.js"></script>
  <script src="flightchecker.js"></script>
  <script src="nav.js"></script>
  
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-8695308WQ8"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);} 
    gtag('js', new Date()); gtag('config', 'G-8695308WQ8');
    if (localStorage.getItem('dyslexiaMode') === 'enabled') document.documentElement.classList.add('dyslexia-font');
  </script>
  <style>
    :root { --bg: #0b0c10; --card: #181920; --border: #272935; --text: #f8fafc; --maroon: #5d1725; --sub: #94a3b8; --gold: #84cc16; --green: #22c55e; --red: #ef4444; }
    * { box-sizing: border-box; }
    body { font-family: system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 16px; }
    body.dyslexia-font, body.dyslexia-font * { font-family: "Comic Sans MS", Verdana, sans-serif !important; letter-spacing: 0.05em !important; word-spacing: 0.1em !important; }
    .dyslexia-toggle { background: var(--card); border: 1px solid var(--border); color: #38bdf8; font-size: 0.75rem; font-weight: 700; padding: 5px 10px; border-radius: 6px; cursor: pointer; }
    .nav-overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.6); z-index:99; opacity:0; visibility:hidden; pointer-events:none; transition:0.2s; }
    .nav-overlay.open { opacity:1; visibility:visible; pointer-events:auto; }
    .nav-drawer { position: fixed; top: 0; left: -260px; width:260px; height:100vh; background:#181920; border-right:1px solid var(--border); z-index:100; display:flex; flex-direction:column; transition:0.3s; box-shadow:4px 0 15px rgba(0,0,0,.5); }
    .nav-drawer.open { left:0; }
    .drawer-header { padding:14px 16px; font-weight:800; font-size:.9rem; text-transform:uppercase; color:#38bdf8; border-bottom:1px solid var(--border); display:flex; justify-content:space-between; align-items:center; }
    .drawer-close { background:none; border:none; color:var(--sub); font-size:1.3rem; cursor:pointer; }
    .drawer-links { list-style:none; padding:8px 0; margin:0; display:flex; flex-direction:column; }
    .drawer-links a { padding:12px 18px; color:var(--text); text-decoration:none; font-size:.85rem; font-weight:700; display:block; border-left:3px solid transparent; }
    .drawer-links a:hover, .drawer-links a.active { background-color:#222530; border-left-color:#38bdf8; color:#38bdf8; }
    header { display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px; margin-bottom:20px; padding-bottom:12px; border-bottom:2px solid var(--maroon); }
    .header-left, .header-right, .header-title { display:flex; align-items:center; gap:8px; }
    .header-left { gap:12px; }
    .menu-btn { background:none; border:none; cursor:pointer; display:flex; flex-direction:column; justify-content:space-between; width:22px; height:18px; padding:0; z-index:101; }
    .menu-btn span { display:block; width:100%; height:2px; background:#38bdf8; border-radius:2px; }
    .msu-logo { height:38px; width:auto; object-fit:contain; filter:drop-shadow(0 0 2px #fff); }
    h1 { margin:0; font-size:1.25rem; font-weight:800; }
    .filter-bar { background: var(--card); border: 1px solid var(--border); border-radius:10px; padding:12px; margin-bottom:16px; display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap; }
    .filter-label { font-size:0.8rem; font-weight:700; color:var(--gold); text-transform:uppercase; letter-spacing:0.04em; }
    select { background:#10141b; color:var(--text); border:1px solid var(--border); border-radius:6px; padding:8px 10px; font-size:0.85rem; font-weight:700; min-width:180px; }
    .summary-bar { background: rgba(132,204,22,0.08); border:1px solid rgba(132,204,22,0.25); border-radius:8px; padding:10px 12px; margin-bottom:16px; color:var(--sub); font-size:0.8rem; font-weight:600; }
    .schedule-card { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 12px; margin-bottom: 8px; display:flex; flex-direction:column; gap:8px; }
    .card-top { display:flex; justify-content:space-between; align-items:center; gap:12px; }
    .game-left, .game-right { display:flex; flex-direction:column; gap:2px; min-width:0; }
    .game-right { text-align:right; align-items:flex-end; flex-shrink:0; }
    .game-date { font-size:0.7rem; color:var(--sub); font-weight:600; }
    .opponent-name { font-size:0.9rem; font-weight:700; display:flex; align-items:center; gap:6px; color:var(--text); word-break:break-word; }
    .opponent-name .homeaway { color:var(--sub); font-size:0.75rem; font-weight:700; }
    .result-badge { font-weight:800; font-size:0.8rem; padding:3px 8px; border-radius:4px; display:inline-block; }
    .result-win { background: rgba(34,197,94,0.2); color:var(--green); border:1px solid rgba(34,197,94,0.4); }
    .result-loss { background: rgba(239,68,68,0.2); color:var(--red); border:1px solid rgba(239,68,68,0.4); }
    .result-neutral { background: rgba(56,189,248,0.12); color:#38bdf8; border:1px solid rgba(56,189,248,0.25); }
    .sport-tag { font-size:0.62rem; color:var(--gold); font-weight:700; text-transform:uppercase; letter-spacing:0.05em; }
    .location-text { font-size:0.72rem; color:var(--sub); }
    .network-badge { display:inline-flex; align-items:center; justify-content:center; background: rgba(59,130,246,0.12); color:#93c5fd; border:1px solid rgba(96,165,250,0.4); border-radius:999px; padding:2px 7px; font-size:0.65rem; font-weight:800; letter-spacing:0.04em; margin-top:2px; }
    .empty-state { background: var(--card); border:1px solid var(--border); border-radius:10px; padding:20px; color:var(--sub); font-size:0.9rem; text-align:center; }
    
    /* Travel Action & Flight Button Styles */
    .card-travel-action {
      padding-top: 8px;
      border-top: 1px solid var(--border);
      text-align: right;
    }
    .card-flight-btn {
      display: inline-block;
      padding: 6px 12px;
      border-radius: 4px;
      text-decoration: none;
      font-size: 0.8rem;
      font-weight: 700;
      transition: opacity 0.2s ease;
    }
    .card-flight-btn:hover {
      opacity: 0.85;
    }
    .card-flight-btn.away-btn {
      background-color: #0284c7;
      color: #ffffff;
    }
    .card-flight-btn.home-btn {
      background-color: var(--maroon);
      color: #ffffff;
      border: 1px solid #832034;
    }
    .drive-badge {
      display: inline-block;
      font-size: 0.75rem;
      color: var(--sub);
      background: #111319;
      padding: 4px 8px;
      border-radius: 4px;
      border: 1px solid var(--border);
    }
  </style>
</head>
<body>
  <header>
    <div class="header-left">
      <button class="menu-btn" onclick="toggleMenu()" aria-label="Toggle Menu"><span></span><span></span><span></span></button>
      <div class="header-title">
        <img src="https://a.espncdn.com/combiner/i?img=/i/teamlogos/ncaa/500/344.png&h=100&w=100" alt="MSU Logo" class="msu-logo">
        <h1>MSU Schedule Tracker</h1>
      </div>
    </div>
    <div class="header-right">
      <button id="fontToggleBtn" class="dyslexia-toggle" onclick="toggleDyslexiaFont()">Kate Button: OFF</button>
    </div>
  </header>

  <div class="filter-bar">
    <span class="filter-label">Sport</span>
    <select id="sportFilter" aria-label="Choose sport">
      <option value="all">All Sports</option>
      <option value="football">Football</option>
      <option value="mens-basketball">Men's Basketball</option>
      <option value="womens-basketball">Women's Basketball</option>
      <option value="baseball">Baseball</option>
      <option value="softball">Softball</option>
    </select>
  </div>

  <div id="summary-bar" class="summary-bar">Loading schedules...</div>
  <div id="schedule-container"></div>

  <div id="debug-box" style="background:#221010; border:1px solid #ef4444; border-radius:8px; padding:12px; margin-top:20px; font-family:monospace; font-size:0.75rem; color:#fca5a5; white-space:pre-wrap; word-break:break-all;">Debug logs will appear here...</div>

  <!-- Modular script pipeline -->
  <script src="data.js"></script>
  <script src="fetcher.js"></script>
  <script src="endschedule.js"></script>
  <script>
    const sportLabels = {
      football: 'Football',
      'mens-basketball': "Men's Basketball",
      'womens-basketball': "Women's Basketball",
      baseball: 'Baseball',
      softball: 'Softball'
    };

    const FUTURE_CUTOFF = '2026-10-19';

    // Opponent abbreviation normalizer to ensure SEC_TRAVEL_MAP lookup matches
    function getOpponentAbbrev(game) {
      if (game.abbrev) return game.abbrev;
      if (game.opponentAbbrev) return game.opponentAbbrev;
      
      const name = (game.opponent || '').toLowerCase();
      if (name.includes('alabama')) return 'ALA';
      if (name.includes('arkansas')) return 'ARK';
      if (name.includes('auburn')) return 'AUB';
      if (name.includes('florida')) return 'FLA';
      if (name.includes('georgia')) return 'UGA';
      if (name.includes('kentucky')) return 'UK';
      if (name.includes('lsu')) return 'LSU';
      if (name.includes('ole miss') || name.includes('mississippi')) return 'OM';
      if (name.includes('missouri')) return 'MIZZ';
      if (name.includes('oklahoma')) return 'OU';
      if (name.includes('south carolina')) return 'SC';
      if (name.includes('tennessee')) return 'TENN';
      if (name.includes('texas a&m')) return 'TAMU';
      if (name.includes('texas')) return 'TEX';
      if (name.includes('vanderbilt')) return 'VANDY';
      return 'MSST';
    }

    function updateToggleButtonState() {
      const btn = document.getElementById('fontToggleBtn');
      if (!btn) return;
      const active = localStorage.getItem('dyslexiaMode') === 'enabled';
      btn.innerText = active ? 'Kate Button: ON' : 'Kate Button: OFF';
      btn.style.borderColor = active ? '#38bdf8' : '#334155';
    }

    function toggleDyslexiaFont() {
      const active = localStorage.getItem('dyslexiaMode') === 'enabled';
      localStorage.setItem('dyslexiaMode', active ? 'disabled' : 'enabled');
      document.body.classList.toggle('dyslexia-font', !active);
      document.documentElement.classList.toggle('dyslexia-font', !active);
      updateToggleButtonState();
    }

    async function getVisibleGames() {
      const masterDataset = await getUnifiedSchedule();
      if (!Array.isArray(masterDataset)) return [];

      const selectedSport = document.getElementById('sportFilter')?.value || 'all';
      
      const todayStr = new Date().toISOString().split('T')[0];
      const today = new Date(`${todayStr}T00:00:00`);

      return masterDataset
        .filter(game => {
          const gameDate = new Date(`${game.isoDate}T00:00:00`);
          const matchesSport = selectedSport === 'all' || game.sportKey === selectedSport;
          const isEligibleByDate = selectedSport === 'all' ? gameDate >= today : true;

          return matchesSport && isEligibleByDate;
        })
        .sort((a, b) => {
          const aDate = new Date(`${a.isoDate}T00:00:00`).getTime();
          const bDate = new Date(`${b.isoDate}T00:00:00`).getTime();
          if (aDate !== bDate) return aDate - bDate;
          return (a.timeStr || '').localeCompare(b.timeStr || '');
        });
    }

    function buildSummaryText(games, selectedSport) {
      if (!games.length) {
        return selectedSport === 'all' ? 'No future games found for the selected sport.' : 'No games found for the selected sport.';
      }

      const totalGames = games.length;
      const homeGames = games.filter(g => g.isHome).length;
      const awayGames = games.filter(g => !g.isHome).length;
      const sportText = selectedSport === 'all' ? 'All sports' : sportLabels[selectedSport];
      const futureText = selectedSport === 'all' ? 'future games' : 'games';

      return `${sportText}: ${totalGames} ${futureText} • ${homeGames} home • ${awayGames} away`;
    }

    async function renderSchedule() {
      const container = document.getElementById('schedule-container');
      const summaryBar = document.getElementById('summary-bar');
      const selectedSport = document.getElementById('sportFilter')?.value || 'all';
      
      const games = await getVisibleGames();
      summaryBar.innerText = buildSummaryText(games, selectedSport);

      if (!container || !games.length) {
        if (container) {
          container.innerHTML = `<div class="empty-state">${selectedSport === 'all' ? 'No future games match the current selection.' : 'No games match the current selection.'}</div>`;
        }
        return;
      }

      container.innerHTML = '';

      const now = new Date();

      games.forEach(game => {
        const broadcast = game.network || '';

        const card = document.createElement('div');
        card.className = 'schedule-card';

        const dateObj = new Date(`${game.isoDate}T00:00:00`);
        const dateStr = dateObj.toLocaleDateString('en-US', {
          weekday: 'short',
          month: 'short',
          day: 'numeric'
        });

        const badge = game.result
          ? (game.result.startsWith('W')
              ? `<span class="result-badge result-win">${game.result}</span>`
              : game.result.startsWith('L')
                ? `<span class="result-badge result-loss">${game.result}</span>`
                : `<span class="result-badge result-neutral">${game.result}</span>`)
          : `<span class="result-badge result-neutral">${game.timeStr || 'TBD'}</span>`;

        const networkBadge = broadcast ? `<span class="network-badge">${broadcast}</span>` : '';

        // Determine if game is completed or in the past
        const isGameComplete = Boolean(game.result);
        const gameEndCutoff = new Date(`${game.isoDate}T23:59:59`);
        const isPastGame = gameEndCutoff < now;

        // Generate travel button ONLY if football, incomplete, and in the future
        const abbrev = getOpponentAbbrev(game);
        const travelActionHtml = (game.sportKey === 'football' && !isGameComplete && !isPastGame && typeof getTravelButtonHtml === 'function') 
          ? getTravelButtonHtml(abbrev, game.isoDate, !game.isHome) 
          : '';

        card.innerHTML = `
          <div class="card-top">
            <div class="game-left">
              <span class="sport-tag">${sportLabels[game.sportKey] || game.sportKey}</span>
              <span class="game-date">${dateStr}</span>
              <div class="opponent-name">
                <span class="homeaway">${game.isHome ? 'vs' : '@'}</span>
                ${game.opponent}
              </div>
            </div>
            <div class="game-right">
              ${badge}
              ${networkBadge}
              <span class="location-text">${game.location || 'Location TBD'}</span>
            </div>
          </div>
          ${travelActionHtml}
        `;

        container.appendChild(card);
      });
    }

    document.addEventListener('DOMContentLoaded', async () => {
      updateToggleButtonState();
      if (localStorage.getItem('dyslexiaMode') === 'enabled') {
        document.body.classList.add('dyslexia-font');
      }

      const sportFilter = document.getElementById('sportFilter');
      if (sportFilter) {
        sportFilter.addEventListener('change', () => renderSchedule());
      }

      await renderSchedule();
    });
  </script>
</body>
</html>
