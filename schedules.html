<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mississippi State Schedules</title>

  <!-- Shared Navigation Script -->
  <script src="nav.js"></script>

  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-8695308WQ8"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());

    gtag('config', 'G-8695308WQ8');

    if (localStorage.getItem('dyslexiaMode') === 'enabled') {
      document.documentElement.classList.add('dyslexia-font');
    }
  </script>

  <style>
    :root {
      --bg: #0b0c10;
      --card-bg: #181920;
      --card-border: #272935;
      --text: #f8fafc;
      --accent-maroon: #5d1725;
      --subtext: #94a3b8;
      --gold: #84cc16;
      --win-green: #22c55e;
      --loss-red: #ef4444;
    }
    * { box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 16px;
    }
    body.dyslexia-font, body.dyslexia-font * {
      font-family: "Comic Sans MS", "Verdana", sans-serif !important;
      letter-spacing: 0.05em !important;
      word-spacing: 0.1em !important;
    }
    .dyslexia-toggle {
      background: #181920;
      border: 1px solid var(--card-border);
      color: #38bdf8;
      font-size: 0.75rem;
      font-weight: 700;
      padding: 5px 10px;
      border-radius: 6px;
      cursor: pointer;
    }

    /* --- NAVIGATION DRAWER STYLES --- */
    .nav-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.6);
      z-index: 99;
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transition: 0.2s;
    }
    .nav-overlay.open {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
    }
    .nav-drawer {
      position: fixed;
      top: 0;
      left: -260px;
      width: 260px;
      height: 100vh;
      background: #181920;
      border-right: 1px solid var(--card-border);
      z-index: 100;
      display: flex;
      flex-direction: column;
      transition: 0.3s;
      box-shadow: 4px 0 15px rgba(0, 0, 0, 0.5);
    }
    .nav-drawer.open { left: 0; }
    .drawer-header {
      padding: 14px 16px;
      font-weight: 800;
      font-size: 0.9rem;
      text-transform: uppercase;
      color: #38bdf8;
      border-bottom: 1px solid var(--card-border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .drawer-close {
      background: none;
      border: none;
      color: var(--subtext);
      font-size: 1.3rem;
      cursor: pointer;
    }
    .drawer-links {
      list-style: none;
      padding: 8px 0;
      margin: 0;
      display: flex;
      flex-direction: column;
    }
    .drawer-links a {
      padding: 12px 18px;
      color: var(--text);
      text-decoration: none;
      font-size: 0.85rem;
      font-weight: 700;
      display: block;
      border-left: 3px solid transparent;
    }
    .drawer-links a:hover, .drawer-links a.active {
      background-color: #222530;
      border-left-color: #38bdf8;
      color: #38bdf8;
    }

    /* --- HEADER STYLES --- */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 20px;
      padding-bottom: 12px;
      border-bottom: 2px solid var(--accent-maroon);
    }
    .header-left, .header-right, .header-title {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .header-left { gap: 12px; }
    .menu-btn {
      background: none;
      border: none;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      width: 22px;
      height: 18px;
      padding: 0;
      z-index: 101;
    }
    .menu-btn span {
      display: block;
      width: 100%;
      height: 2px;
      background-color: #38bdf8;
      border-radius: 2px;
    }
    .msu-logo {
      height: 38px;
      width: auto;
      object-fit: contain;
      filter: drop-shadow(0 0 2px #fff);
    }
    h1 { margin: 0; font-size: 1.25rem; font-weight: 800; }

    .sport-filter-bar {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding-bottom: 8px;
      margin-bottom: 12px;
      white-space: nowrap;
    }
    .sport-tab {
      background: #181920;
      border: 1px solid var(--card-border);
      color: var(--subtext);
      font-size: 0.75rem;
      font-weight: 700;
      padding: 5px 10px;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .sport-tab.active, .sport-tab:hover {
      background: var(--accent-maroon);
      color: #fff;
      border-color: #7d2033;
    }

    .record-banner {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-left: 4px solid var(--gold);
      border-radius: 8px;
      padding: 10px 14px;
      margin-bottom: 12px;
      display: flex;
      justify-content: space-around;
      align-items: center;
      box-shadow: 0 2px 6px rgba(0,0,0,0.3);
    }
    .record-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
    }
    .record-label {
      font-size: 0.65rem;
      color: var(--subtext);
      text-transform: uppercase;
      font-weight: 700;
      letter-spacing: 0.5px;
    }
    .record-value {
      font-size: 0.95rem;
      font-weight: 800;
      color: #fff;
    }

    .schedule-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      padding: 8px 12px;
      margin-bottom: 6px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 2px 6px rgba(0,0,0,0.3);
    }
    .game-left {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .game-date {
      font-size: 0.7rem;
      color: var(--subtext);
      font-weight: 600;
    }
    .opponent-name {
      font-size: 0.9rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .game-right {
      text-align: right;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 2px;
    }
    .result-badge {
      font-weight: 800;
      font-size: 0.8rem;
      padding: 2px 6px;
      border-radius: 4px;
      display: inline-block;
    }
    .result-win { background: rgba(34, 197, 94, 0.2); color: var(--win-green); border: 1px solid rgba(34, 197, 94, 0.4); }
    .result-loss { background: rgba(239, 68, 68, 0.2); color: var(--loss-red); border: 1px solid rgba(239, 68, 68, 0.4); }
    .sport-tag {
      font-size: 0.65rem;
      color: var(--gold);
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .tv-tag {
      font-size: 0.65rem;
      color: var(--gold);
      font-weight: bold;
    }
  </style>
</head>
<body>

  <header>
    <div class="header-left">
      <button class="menu-btn" onclick="toggleMenu()" aria-label="Toggle Menu"><span></span><span></span><span></span></button>
      <div class="header-title">
        <img src="https://a.espncdn.com/combiner/i?img=/i/teamlogos/ncaa/500/344.png&h=100&w=100" alt="MSU Logo" class="msu-logo">
        <h1>MSU Schedules</h1>
      </div>
    </div>
    <div class="header-right">
      <button id="fontToggleBtn" class="dyslexia-toggle" onclick="toggleDyslexiaFont()">Kate Button: OFF</button>
    </div>
  </header>

  <div class="sport-filter-bar">
    <button class="sport-tab active" onclick="filterSport('all', this)">All Sports</button>
    <button class="sport-tab" onclick="filterSport('football', this)">🏈 Football</button>
    <button class="sport-tab" onclick="filterSport('mens-basketball', this)">🏀 Men's BB</button>
    <button class="sport-tab" onclick="filterSport('womens-basketball', this)">🏀 Women's BB</button>
    <button class="sport-tab" onclick="filterSport('baseball', this)">⚾ Baseball</button>
    <button class="sport-tab" onclick="filterSport('softball', this)">🥎 Softball</button>
  </div>

  <div id="schedule-container">Loading complete schedules...</div>

  <!-- External fallback dataset -->
  <script src="data.js"></script>

  <script>
    function updateToggleButtonState() {
      const btn = document.getElementById('fontToggleBtn');
      if (!btn) return;
      const active = localStorage.getItem('dyslexiaMode') === 'enabled';
      btn.innerText = active ? 'Kate Button: ON' : 'Kate Button: OFF';
      btn.style.borderColor = active ? '#38bdf8' : '#334155';
    }

    function toggleDyslexiaFont() {
      const active = localStorage.getItem('dyslexiaMode') === 'enabled';
      localStorage.setItem('dyslexiaMode', active ? 'disabled' : 'enabled');
      document.body.classList.toggle('dyslexia-font', !active);
      document.documentElement.classList.toggle('dyslexia-font', !active);
      updateToggleButtonState();
    }

    const sportLabels = {
      'football': 'Football',
      'mens-basketball': 'Men\'s Basketball',
      'womens-basketball': 'Women\'s Basketball',
      'baseball': 'Baseball',
      'softball': 'Softball'
    };

    const espnEndpoints = [
      { key: 'football', url: 'https://site.api.espn.com/apis/site/v2/sports/football/college-football/teams/344/schedule' },
      { key: 'mens-basketball', url: 'https://site.api.espn.com/apis/site/v2/sports/basketball/mens-college-basketball/teams/344/schedule' },
      { key: 'womens-basketball', url: 'https://site.api.espn.com/apis/site/v2/sports/basketball/womens-college-basketball/teams/344/schedule' },
      { key: 'baseball', url: 'https://site.api.espn.com/apis/site/v2/sports/baseball/college-baseball/teams/344/schedule' },
      { key: 'softball', url: 'https://site.api.espn.com/apis/site/v2/sports/baseball/college-softball/teams/344/schedule' }
    ];

    let combinedDataset = [];
    let currentFilter = 'all';

    function extractBroadcastNetwork(comp) {
      if (!comp) return '';

      if (comp.broadcasts && comp.broadcasts.length > 0) {
        for (const b of comp.broadcasts) {
          if (b.media && b.media.shortName) return b.media.shortName;
          if (b.names && b.names[0]) return b.names[0];
          if (b.station) return b.station;
        }
      }

      if (comp.geoBroadcasts && comp.geoBroadcasts.length > 0) {
        for (const gb of comp.geoBroadcasts) {
          if (gb.media && gb.media.shortName) return gb.media.shortName;
          if (gb.type && gb.type.shortName) return gb.type.shortName;
        }
      }

      return '';
    }

    async function loadMasterDataset() {
      combinedDataset = [];

      const promises = espnEndpoints.map(async (sport) => {
        try {
          const res = await fetch(sport.url);
          if (!res.ok) return;
          const data = await res.json();

          if (data && data.events) {
            data.events.forEach(event => {
              const comp = event.competitions[0];
              const msuComp = comp.competitors.find(c => c.id === '344');
              const oppComp = comp.competitors.find(c => c.id !== '344');

              if (!oppComp) return;

              const gameIso = event.date.split('T')[0];
              const broadcastNet = extractBroadcastNetwork(comp);

              // Detect if game is an SEC conference matchup
              const isSecGame = comp.conferenceCompetition === true || 
                                (comp.notes && comp.notes.some(n => n.headline && n.headline.toLowerCase().includes('sec')));

              let timeStr = 'TBD';
              if (event.date) {
                const dateObj = new Date(event.date);
                if (!isNaN(dateObj) && event.timeValid !== false) {
                  timeStr = dateObj.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });
                }
              }

              let resultStr = null;
              const gameState = event.status?.type?.state;

              if (gameState === 'post' && msuComp && oppComp) {
                const msuScore = parseInt(msuComp.score?.value || msuComp.score || "0");
                const oppScore = parseInt(oppComp.score?.value || oppComp.score || "0");
                const isWin = msuComp.winner ?? (msuScore > oppScore);
                resultStr = `${isWin ? 'W' : 'L'} ${msuScore}-${oppScore}`;
              } else if (gameState === 'in' && msuComp && oppComp) {
                const msuScore = msuComp.score?.value || msuComp.score || "0";
                const oppScore = oppComp.score?.value || oppComp.score || "0";
                resultStr = `LIVE ${msuScore}-${oppScore}`;
              }

              combinedDataset.push({
                sportKey: sport.key,
                opponent: oppComp.team.displayName || oppComp.team.shortDisplayName || 'Opponent',
                isoDate: gameIso,
                timeStr: timeStr,
                isHome: msuComp.homeAway === 'home',
                isSec: isSecGame,
                tv: broadcastNet,
                result: resultStr,
                source: 'espn'
              });
            });
          }
        } catch (err) {
          console.log(`ESPN sync failed for ${sport.key}:`, err);
        }
      });

      await Promise.all(promises);

      if (typeof masterDataset !== 'undefined' && Array.isArray(masterDataset)) {
        masterDataset.forEach(localGame => {
          const matchedEspnGame = combinedDataset.find(
            espnGame => espnGame.sportKey === localGame.sportKey && espnGame.isoDate === localGame.isoDate
          );

          if (matchedEspnGame) {
            if (!matchedEspnGame.result && localGame.result && localGame.result.trim() !== '') {
              matchedEspnGame.result = localGame.result;
            }
            if (!matchedEspnGame.tv && localGame.tv) {
              matchedEspnGame.tv = localGame.tv;
            }
            if (localGame.isSec !== undefined) {
              matchedEspnGame.isSec = localGame.isSec;
            }
          } else {
            combinedDataset.push({
              isSec: false,
              ...localGame,
              source: 'js'
            });
          }
        });
      }

      combinedDataset.sort((a, b) => new Date(a.isoDate) - new Date(b.isoDate));
    }

    function renderSchedule() {
      const container = document.getElementById("schedule-container");
      if (!container) return;
      container.innerHTML = "";

      if (!combinedDataset.length) {
        container.innerHTML = "<p style='color:var(--subtext);'>Unable to load schedule data.</p>";
        return;
      }

      const todayIso = new Date().toLocaleDateString('en-CA');

      // 1. Render Record Banner if viewing an individual sport tab
      if (currentFilter !== 'all') {
        const sportGames = combinedDataset.filter(ev => ev.sportKey === currentFilter);
        
        let overallWins = 0, overallLosses = 0;
        let secWins = 0, secLosses = 0;

        sportGames.forEach(ev => {
          if (ev.result && (ev.result.startsWith('W') || ev.result.startsWith('L'))) {
            const isWin = ev.result.startsWith('W');
            if (isWin) overallWins++; else overallLosses++;
            if (ev.isSec) {
              if (isWin) secWins++; else secLosses++;
            }
          }
        });

        const bannerHtml = `
          <div class="record-banner">
            <div class="record-item">
              <span class="record-label">Overall Record</span>
              <span class="record-value">${overallWins}-${overallLosses}</span>
            </div>
            <div class="record-item">
              <span class="record-label">SEC Record</span>
              <span class="record-value">${secWins}-${secLosses}</span>
            </div>
          </div>
        `;
        container.insertAdjacentHTML('beforeend', bannerHtml);
      }

      // 2. Filter games list
      const filtered = combinedDataset.filter(ev => {
        if (currentFilter === 'all') {
          return ev.isoDate >= todayIso;
        }
        return ev.sportKey === currentFilter;
      });

      if (filtered.length === 0) {
        const emptyMsg = document.createElement("p");
        emptyMsg.style.color = "var(--subtext)";
        emptyMsg.textContent = "No games found for this selection.";
        container.appendChild(emptyMsg);
        return;
      }

      filtered.forEach(ev => {
        const gameDate = new Date(ev.isoDate + 'T00:00:00');
        const dateFormatted = gameDate.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });

        let resultBadgeHtml = '';
        let tvInfo = '';

        const isPastGame = ev.isoDate < todayIso || Boolean(ev.result);

        if (isPastGame && ev.result) {
          const isWin = ev.result.startsWith('W');
          resultBadgeHtml = `<span class="result-badge ${isWin ? 'result-win' : 'result-loss'}">${ev.result}</span>`;
        } else if (isPastGame) {
          resultBadgeHtml = `<span class="game-date">${ev.timeStr}</span>`;
        } else {
          resultBadgeHtml = `<span class="game-date">${ev.timeStr}</span>`;
          if (ev.tv) {
            tvInfo = `<span class="tv-tag">📺 ${ev.tv}</span>`;
          }
        }

        const card = document.createElement("div");
        card.className = "schedule-card";
        card.innerHTML = `
          <div class="game-left">
            <span class="sport-tag">${sportLabels[ev.sportKey] || 'Sports'}</span>
            <span class="game-date">${dateFormatted}</span>
            <div class="opponent-name">
              <span style="color:var(--subtext); font-size:0.75rem;">${ev.isHome ? 'vs' : '@'}</span>
              ${ev.opponent}
            </div>
          </div>
          <div class="game-right">
            ${resultBadgeHtml}
            ${tvInfo}
          </div>
        `;
        container.appendChild(card);
      });
    }

    function filterSport(sportKey, btnElement) {
      currentFilter = sportKey;
      document.querySelectorAll('.sport-tab').forEach(t => t.classList.remove('active'));
      btnElement.classList.add('active');
      renderSchedule();
    }

    window.onload = async function() {
      updateToggleButtonState();
      if (localStorage.getItem('dyslexiaMode') === 'enabled') document.body.classList.add('dyslexia-font');
      try {
        await loadMasterDataset();
        renderSchedule();
      } catch (err) {
        const container = document.getElementById("schedule-container");
        if (container) container.innerHTML = "<p style='color:var(--subtext);'>Error rendering schedule data.</p>";
      }
    };
  </script>

</body>
</html>
