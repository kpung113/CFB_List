name: Scrape SEC Availability Reports

on:
  schedule:
    - cron: '0 */6 * * 3,4,5,6'
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Run Scraper Script
        run: python scrape_sec_injuries.py

      - name: Commit and push updated JSON file
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add sec-injuries.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update SEC injury report" && git push)
          
