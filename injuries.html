<script>
  async function loadReports() {
    const container = document.getElementById('injuries-container');
    if (!container) {
      console.error("Injuries error: #injuries-container element not found on the page.");
      return;
    }

    try {
      // Show a loading state so you never see a blank white screen
      container.innerHTML = "<p style='color: #38bdf8; text-align: center; padding: 20px;'>Loading injury reports...</p>";

      const fetchFn = window.fetchAllCFBInjuries || window.fetchAllSECInjuries;
      if (!fetchFn) {
        container.innerHTML = "<p style='color:var(--red, #ef4444);'>injuries.js script failed to load (functions not found on window).</p>";
        return;
      }

      // Fetch injury data
      const data = await fetchFn();
      
      // Clear loading state
      container.innerHTML = "";
      
      const teams = Object.keys(data || {});
      const activeTeams = teams.filter(t => data[t]?.players && data[t].players.length > 0);

      if (activeTeams.length === 0) {
        container.innerHTML = `
          <div class="team-card" style="text-align: center; padding: 24px;">
            <span class="team-name" style="color: #38bdf8;">Clean Bill of Health</span>
            <p class="player-detail" style="margin-top: 8px;">No reported player injuries or availability restrictions at this time.</p>
          </div>`;
        return;
      }

      activeTeams.forEach(teamName => {
        const teamData = data[teamName];
        const players = teamData.players || [];

        const card = document.createElement('div');
        card.className = 'team-card';

        let playersHtml = players.map(p => {
          const st = (p.status || '').toLowerCase();
          let badgeClass = 'status-tag status-probable';
          if (st.includes('out')) badgeClass = 'status-tag status-out';
          else if (st.includes('question') || st.includes('doubt')) badgeClass = 'status-tag status-questionable';

          return `
            <div class="player-row">
              <div class="player-info">
                <span class="player-name">${p.player || 'Unknown Player'} ${p.position ? `(${p.position})` : ''}</span>
                <span class="player-detail">${p.details || p.type || ''}</span>
              </div>
              <span class="${badgeClass}">${p.status || 'Unknown'}</span>
            </div>
          `;
        }).join('');

        card.innerHTML = `
          <div class="team-header">
            <span class="team-name">${teamName}</span>
            <span class="report-count">${players.length} Reported</span>
          </div>
          ${playersHtml}
        `;

        container.appendChild(card);
      });

    } catch (err) {
      console.error("Error inside loadReports:", err);
      container.innerHTML = `<p style="color:var(--red, #ef4444);">Error rendering page: ${err.message}</p>`;
    }
  }

  // Robust execution check: handles both normal loads and late injections
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', loadReports);
  } else {
    loadReports();
  }
</script>
