<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SEC Football Injury Report</title>
  <script src="nav.js"></script>
  <style>
    :root {
      --bg-dark: #121212;
      --card-bg: #1e1e24;
      --border: #272935;
      --accent-maroon: #5d1725;
      --text-main: #f0f0f0;
      --text-muted: #a0a0a0;
      --status-out: #d9534f;
      --status-quest: #f0ad4e;
      --status-prob: #5cb85c;
    }

    * {
      box-sizing: border-box;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 16px;
    }

    /* Kate Button / Dyslexia Support Override */
    body.dyslexia-mode {
      font-family: "OpenDyslexic", "Comic Sans MS", sans-serif !important;
    }

    /* Hamburger Nav Drawer Overlay & Drawer Styling */
    .nav-overlay { 
      position: fixed; 
      top: 0; 
      left: 0; 
      width: 100vw; 
      height: 100vh; 
      background: rgba(0,0,0,0.6); 
      z-index: 99; 
      opacity: 0; 
      visibility: hidden; 
      pointer-events: none; 
      transition: 0.2s; 
    }
    .nav-overlay.open { 
      opacity: 1; 
      visibility: visible; 
      pointer-events: auto; 
    }
    .nav-drawer { 
      position: fixed; 
      top: 0; 
      left: -260px; 
      width: 260px; 
      height: 100vh; 
      background: #181920; 
      border-right: 1px solid var(--border); 
      z-index: 100; 
      display: flex; 
      flex-direction: column; 
      transition: 0.3s; 
      box-shadow: 4px 0 15px rgba(0,0,0,.5); 
    }
    .nav-drawer.open { 
      left: 0; 
    }
    .drawer-header { 
      padding: 14px 16px; 
      font-weight: 800; 
      font-size: .9rem; 
      text-transform: uppercase; 
      color: #38bdf8; 
      border-bottom: 1px solid var(--border); 
      display: flex; 
      justify-content: space-between; 
      align-items: center; 
    }
    .drawer-close { 
      background: none; 
      border: none; 
      color: var(--text-muted); 
      font-size: 1.3rem; 
      cursor: pointer; 
    }
    .drawer-links { 
      list-style: none; 
      padding: 8px 0; 
      margin: 0; 
      display: flex; 
      flex-direction: column; 
    }
    .drawer-links a { 
      padding: 12px 18px; 
      color: var(--text-main); 
      text-decoration: none; 
      font-size: .85rem; 
      font-weight: 700; 
      display: block; 
      border-left: 3px solid transparent; 
    }
    .drawer-links a:hover, .drawer-links a.active { 
      background-color: #222530; 
      border-left-color: #38bdf8; 
      color: #38bdf8; 
    }

    /* Header & Navigation Bar */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 20px;
      padding-bottom: 12px;
      border-bottom: 2px solid var(--accent-maroon);
    }

    .header-left, .header-right, .header-title {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .header-left {
      gap: 12px;
    }

    .menu-btn {
      background: none;
      border: none;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      width: 22px;
      height: 18px;
      padding: 0;
      z-index: 101;
    }

    .menu-btn span {
      display: block;
      width: 100%;
      height: 2px;
      background: #38bdf8;
      border-radius: 2px;
    }

    h1 {
      font-size: 1.25rem;
      font-weight: 800;
      margin: 0;
    }

    .kate-btn {
      background: var(--card-bg);
      color: #38bdf8;
      border: 1px solid var(--border);
      font-size: 0.75rem;
      font-weight: 700;
      padding: 5px 10px;
      border-radius: 6px;
      cursor: pointer;
    }

    #loading-state {
      text-align: center;
      padding: 40px;
      color: var(--text-muted);
    }

    .injury-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 16px;
    }

    .team-card {
      background: var(--card-bg);
      border-radius: 8px;
      padding: 16px;
      border-left: 4px solid var(--accent-maroon);
    }

    .team-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .team-name {
      font-weight: bold;
      font-size: 1.1rem;
    }

    .player-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 0;
      border-bottom: 1px solid #2a2a32;
    }

    .player-row:last-child {
      border-bottom: none;
    }

    .player-info {
      display: flex;
      flex-direction: column;
    }

    .player-name {
      font-weight: 600;
    }

    .player-pos-type {
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    .status-badge {
      font-size: 0.75rem;
      font-weight: bold;
      padding: 4px 8px;
      border-radius: 4px;
      text-transform: uppercase;
    }

    .status-out { background: var(--status-out); color: #fff; }
    .status-questionable { background: var(--status-quest); color: #000; }
    .status-probable { background: var(--status-prob); color: #000; }
    .status-default { background: #444; color: #fff; }
  </style>
</head>
<body>

  <header>
    <div class="header-left">
      <button class="menu-btn" onclick="toggleMenu()" aria-label="Toggle Menu">
        <span></span><span></span><span></span>
      </button>
      <div class="header-title">
        <h1>SEC Availability Report</h1>
      </div>
    </div>
    <div class="header-right">
      <button class="kate-btn" id="kate-toggle" onclick="toggleDyslexia()">Kate Button</button>
    </div>
  </header>

  <div id="loading-state">Fetching SEC injury reports from ESPN...</div>
  <div class="injury-grid" id="injury-container"></div>

  <!-- Project Script Pipeline -->
  <script src="injuries.js"></script>
  <script>
    // Global Kate Button Persistence
    if (localStorage.getItem('dyslexiaMode') === 'true') {
      document.body.classList.add('dyslexia-mode');
    }

    function toggleDyslexia() {
      document.body.classList.toggle('dyslexia-mode');
      localStorage.setItem('dyslexiaMode', document.body.classList.contains('dyslexia-mode'));
    }

    function getStatusClass(status) {
      const s = String(status).toLowerCase();
      if (s.includes('out')) return 'status-out';
      if (s.includes('questionable') || s.includes('doubtful')) return 'status-questionable';
      if (s.includes('probable') || s.includes('available')) return 'status-prob';
      return 'status-default';
    }

    async function loadInjuryDashboard() {
      const container = document.getElementById('injury-container');
      const loader = document.getElementById('loading-state');

      try {
        const secData = await fetchAllSECInjuries();
        loader.style.display = 'none';

        const teamNames = Object.keys(secData);
        if (teamNames.length === 0) {
          container.innerHTML = '<p style="text-align:center; grid-column: 1/-1;">No official injuries reported across the SEC today.</p>';
          return;
        }

        teamNames.forEach(teamName => {
          const teamInfo = secData[teamName];
          const card = document.createElement('div');
          card.className = 'team-card';

          let playersHTML = teamInfo.players.map(p => `
            <div class="player-row">
              <div class="player-info">
                <span class="player-name">${p.player} ${p.position ? `(${p.position})` : ''}</span>
                <span class="player-pos-type">${p.details || p.type}</span>
              </div>
              <span class="status-badge ${getStatusClass(p.status)}">${p.status}</span>
            </div>
          `).join('');

          card.innerHTML = `
            <div class="team-header">
              <span class="team-name">${teamName}</span>
              <span style="font-size: 0.8rem; color: var(--text-muted);">${teamInfo.players.length} Reported</span>
            </div>
            ${playersHTML}
          `;

          container.appendChild(card);
        });

      } catch (err) {
        loader.innerText = "Failed to load injury reports.";
      }
    }

    document.addEventListener('DOMContentLoaded', loadInjuryDashboard);
  </script>
</body>
</html>
