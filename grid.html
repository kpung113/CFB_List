<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Saturday Grid - Live Games</title>
  
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-8695308WQ8"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());

    gtag('config', 'G-8695308WQ8');
  </script>

  <style>
    /* Reset & Fullscreen Shell */
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100vw;
      height: 100vh;
      background-color: #0f172a;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      overflow: hidden; /* Enforces zero scrolling on the page */
    }

    /* Top Bar Header */
    header {
      height: 36px;
      background-color: #1e293b;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 12px;
      border-bottom: 1px solid #334155;
      flex-shrink: 0;
    }

    .title {
      font-weight: 700;
      font-size: 0.85rem;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: #38bdf8;
    }

    .meta-info {
      font-size: 0.75rem;
      color: #94a3b8;
      display: flex;
      gap: 12px;
    }

    .live-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      color: #ef4444;
      font-weight: 600;
    }

    .pulse-dot {
      width: 6px;
      height: 6px;
      background-color: #ef4444;
      border-radius: 50%;
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
      70% { transform: scale(1); box-shadow: 0 0 0 6px rgba(239, 68, 68, 0); }
      100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
    }

    /* Grid Layout Container - Single Screen Lock */
    #grid-container {
      flex: 1;
      display: grid;
      gap: 4px;
      padding: 4px;
      width: 100%;
      height: calc(100vh - 36px);
      overflow: hidden; /* Fits all rows into exact view height */
    }

    /* Compact Game Card Styling */
    .game-card {
      background-color: #1e293b;
      border: 1px solid #334155;
      border-radius: 4px;
      padding: 3px 5px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-width: 0;
      min-height: 0; /* Allows cards to shrink dynamically to fit height */
      overflow: hidden;
    }

    .game-card.sec-game {
      border-left: 3px solid #f59e0b;
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      font-size: 0.6rem;
      color: #94a3b8;
      font-weight: 600;
      border-bottom: 1px solid #334155;
      padding-bottom: 1px;
      margin-bottom: 2px;
      gap: 2px;
      line-height: 1;
    }

    .broadcast {
      color: #38bdf8;
      font-size: 0.55rem;
      flex-shrink: 0;
      text-align: right;
    }

    .clock-status {
      color: #ef4444;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .teams-container {
      display: flex;
      flex-direction: column;
      gap: 1px;
      flex: 1;
      justify-content: center;
    }

    .team-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 3px;
    }

    .team-info {
      display: flex;
      align-items: center;
      gap: 2px;
      flex: 1;
      min-width: 0;
      overflow: hidden;
    }

    .team-rank {
      font-size: 0.55rem;
      color: #fbbf24;
      font-weight: 800;
      flex-shrink: 0;
    }

    .team-abbr {
      font-weight: 700;
      font-size: 0.75rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .team-score {
      font-weight: 800;
      font-size: 0.8rem;
      flex-shrink: 0;
      font-variant-numeric: tabular-nums;
      min-width: 16px;
      text-align: right;
    }

    .poss-dot {
      width: 4px;
      height: 4px;
      background-color: #f59e0b;
      border-radius: 50%;
      flex-shrink: 0;
    }

    /* Empty State */
    .no-games {
      grid-column: 1 / -1;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #64748b;
      font-size: 1.1rem;
      font-weight: 600;
    }
  </style>
</head>
<body>

  <header>
    <div class="title">Saturday Grid</div>
    <div class="meta-info">
      <span class="live-badge"><span class="pulse-dot"></span> <span id="live-count">0</span> LIVE</span>
      <span id="last-updated">Updating...</span>
    </div>
  </header>

  <div id="grid-container"></div>

  <script>
    const API_URL = 'https://site.api.espn.com/apis/site/v2/sports/football/college-football/scoreboard?limit=300&groups=80';

    function isSEC(game) {
      return game.competitions[0].competitors.some(c => 
        c.team.conferenceId === '8' || 
        (c.team.conference && c.team.conference.id === '8')
      );
    }

    function isRanked(game) {
      return game.competitions[0].competitors.some(c => 
        c.curatedRank && c.curatedRank.current <= 25 && c.curatedRank.current > 0
      );
    }

    function sortGames(games) {
      return games.sort((a, b) => {
        const aSEC = isSEC(a);
        const bSEC = isSEC(b);
        if (aSEC && !bSEC) return -1;
        if (!aSEC && bSEC) return 1;

        const aRanked = isRanked(a);
        const bRanked = isRanked(b);
        if (aRanked && !bRanked) return -1;
        if (!aRanked && bRanked) return 1;

        return new Date(a.date) - new Date(b.date);
      });
    }

    function adjustGridDimensions(count) {
      const container = document.getElementById('grid-container');
      if (count === 0) return;

      const screenWidth = window.innerWidth;

      // Mobile / Compact Viewports (<768px): Dynamically scale columns to fit single screen
      if (screenWidth < 768) {
        let cols = 2;
        
        // Increase columns to 3 when game count reaches 10+ so all rows fit on screen
        if (count >= 10) {
          cols = 3;
        }

        const rows = Math.ceil(count / cols);
        container.style.gridTemplateColumns = `repeat(${cols}, 1fr)`;
        container.style.gridTemplateRows = `repeat(${rows}, 1fr)`;
        return;
      }

      // Desktop / Tablet Viewports: Dynamic fullscreen grid
      let cols = 1;
      let rows = 1;

      if (count === 1) { cols = 1; rows = 1; }
      else if (count === 2) { cols = 2; rows = 1; }
      else if (count <= 4) { cols = 2; rows = 2; }
      else if (count <= 6) { cols = 3; rows = 2; }
      else if (count <= 9) { cols = 3; rows = 3; }
      else if (count <= 12) { cols = 4; rows = 3; }
      else if (count <= 16) { cols = 4; rows = 4; }
      else if (count <= 20) { cols = 5; rows = 4; }
      else if (count <= 24) { cols = 6; rows = 4; }
      else { cols = 6; rows = Math.ceil(count / 6); }

      container.style.gridTemplateColumns = `repeat(${cols}, 1fr)`;
      container.style.gridTemplateRows = `repeat(${rows}, 1fr)`;
    }

    async function fetchLiveGrid() {
      try {
        const res = await fetch(API_URL);
        const data = await res.json();
        
        const activeGames = (data.events || []).filter(e => {
          const state = e.status.type.state;
          return state === 'in';
        });

        const sortedActiveGames = sortGames(activeGames);
        
        document.getElementById('live-count').innerText = sortedActiveGames.length;
        document.getElementById('last-updated').innerText = `Updated: ${new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' })}`;

        renderGrid(sortedActiveGames);
      } catch (err) {
        console.error('Error fetching live games:', err);
      }
    }

    function renderGrid(games) {
      const container = document.getElementById('grid-container');
      container.innerHTML = '';

      if (games.length === 0) {
        container.style.gridTemplateColumns = '1fr';
        container.style.gridTemplateRows = '1fr';
        container.innerHTML = `<div class="no-games">No live games currently in progress.</div>`;
        return;
      }

      adjustGridDimensions(games.length);

      games.forEach(game => {
        const comp = game.competitions[0];
        const home = comp.competitors.find(c => c.homeAway === 'home');
        const away = comp.competitors.find(c => c.homeAway === 'away');
        const broadcast = comp.broadcasts && comp.broadcasts[0] ? comp.broadcasts[0].names[0] : '';
        const isSecGame = isSEC(game);

        const awayAbbr = away.team.abbreviation || away.team.shortDisplayName || away.team.name;
        const homeAbbr = home.team.abbreviation || home.team.shortDisplayName || home.team.name;

        const card = document.createElement('div');
        card.className = `game-card ${isSecGame ? 'sec-game' : ''}`;

        card.innerHTML = `
          <div class="card-header">
            <span class="clock-status">${game.status.type.detail}</span>
            <span class="broadcast">${broadcast}</span>
          </div>
          <div class="teams-container">
            <div class="team-row">
              <div class="team-info">
                ${away.curatedRank?.current <= 25 ? `<span class="team-rank">#${away.curatedRank.current}</span>` : ''}
                <span class="team-abbr">${awayAbbr}</span>
                ${away.possess ? '<span class="poss-dot"></span>' : ''}
              </div>
              <span class="team-score">${away.score}</span>
            </div>
            <div class="team-row">
              <div class="team-info">
                ${home.curatedRank?.current <= 25 ? `<span class="team-rank">#${home.curatedRank.current}</span>` : ''}
                <span class="team-abbr">${homeAbbr}</span>
                ${home.possess ? '<span class="poss-dot"></span>' : ''}
              </div>
              <span class="team-score">${home.score}</span>
            </div>
          </div>
        `;
        container.appendChild(card);
      });
    }

    window.addEventListener('resize', () => {
      const liveCount = parseInt(document.getElementById('live-count').innerText) || 0;
      if (liveCount > 0) adjustGridDimensions(liveCount);
    });

    fetchLiveGrid();
    setInterval(fetchLiveGrid, 15000);
  </script>
</body>
</html>
