<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live & Completed Games</title>
  <script src="nav.js"></script>
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-8695308WQ8"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date()); gtag('config', 'G-8695308WQ8');
    if (localStorage.getItem('dyslexiaMode') === 'enabled') document.documentElement.classList.add('dyslexia-font');
  </script>
  <style>
    body.dyslexia-font, body.dyslexia-font * { font-family: "Comic Sans MS", "Verdana", sans-serif !important; letter-spacing: 0.05em !important; word-spacing: 0.1em !important; }
    .dyslexia-toggle { background: #1e293b; border: 1px solid #334155; color: #38bdf8; font-size: 0.75rem; font-weight: 700; padding: 5px 10px; border-radius: 6px; cursor: pointer; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100vw; min-height: 100vh; background: #0f172a; color: #f8fafc; font-family: system-ui, -apple-system, sans-serif; display: flex; flex-direction: column; }
    header { height: 36px; background: #1e293b; display: flex; align-items: center; justify-content: space-between; padding: 0 12px; border-bottom: 1px solid #334155; position: sticky; top: 0; z-index: 10; }
    .header-left, .meta-info { display: flex; align-items: center; gap: 10px; }
    .menu-btn { background: none; border: none; cursor: pointer; display: flex; flex-direction: column; justify-content: space-between; width: 18px; height: 14px; padding: 0; }
    .menu-btn span { display: block; width: 100%; height: 2px; background: #38bdf8; border-radius: 2px; }
    .nav-overlay { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.6); z-index: 99; opacity: 0; visibility: hidden; pointer-events: none; transition: 0.2s; }
    .nav-overlay.open { opacity: 1; visibility: visible; pointer-events: auto; }
    .nav-drawer { position: fixed; top: 0; left: -260px; width: 260px; height: 100vh; background: #1e293b; border-right: 1px solid #334155; z-index: 100; display: flex; flex-direction: column; transition: 0.3s; box-shadow: 4px 0 15px rgba(0,0,0,0.5); }
    .nav-drawer.open { left: 0; }
    .drawer-header { padding: 14px 16px; font-weight: 800; font-size: 0.9rem; text-transform: uppercase; color: #38bdf8; border-bottom: 1px solid #334155; display: flex; justify-content: space-between; align-items: center; }
    .drawer-close { background: none; border: none; color: #94a3b8; font-size: 1.3rem; cursor: pointer; }
    .drawer-links { list-style: none; padding: 8px 0; margin: 0; display: flex; flex-direction: column; }
    .drawer-links a { padding: 12px 18px; color: #f8fafc; text-decoration: none; font-size: 0.85rem; font-weight: 700; display: block; border-left: 3px solid transparent; }
    .drawer-links a:hover, .drawer-links a.active { background: #334155; border-left-color: #38bdf8; color: #38bdf8; }
    .title { font-weight: 700; font-size: 0.85rem; text-transform: uppercase; color: #38bdf8; }
    .meta-info { font-size: 0.75rem; color: #94a3b8; }
    .live-badge { display: inline-flex; align-items: center; gap: 4px; color: #ef4444; font-weight: 600; }
    .pulse-dot { width: 6px; height: 6px; background: #ef4444; border-radius: 50%; animation: pulse 1.5s infinite; }
    @keyframes pulse { 0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); } 70% { transform: scale(1); box-shadow: 0 0 0 6px rgba(239, 68, 68, 0); } 100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); } }
    .section-divider { grid-column: 1 / -1; font-size: 0.7rem; font-weight: 800; text-transform: uppercase; color: #38bdf8; background: #0f172a; padding: 6px 4px 2px; border-bottom: 1px solid #334155; margin-top: 4px; display: flex; justify-content: space-between; }
    .section-divider.completed-title { color: #94a3b8; margin-top: 12px; }
    #grid-container { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; padding: 4px; width: 100%; }
    .game-card { background: #1e293b; border: 1px solid #334155; border-radius: 4px; padding: 4px 6px; display: flex; flex-direction: column; overflow: hidden; }
    .game-card.sec-game { border-left: 3px solid #f59e0b; }
    .game-card.completed-card { opacity: 0.85; background: #172033; }
    .card-header { display: flex; justify-content: space-between; align-items: center; font-size: 0.6rem; color: #94a3b8; font-weight: 600; border-bottom: 1px solid #334155; padding-bottom: 2px; margin-bottom: 3px; }
    .broadcast { color: #84cc16; font-size: 0.55rem; display: flex; align-items: center; gap: 4px; }
    .sort-tag { background: #334155; color: #38bdf8; font-size: 0.5rem; padding: 1px 3px; border-radius: 3px; font-weight: 700; }
    .clock-status { color: #ef4444; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .clock-status.completed-status { color: #94a3b8; }
    .teams-container { display: flex; flex-direction: column; gap: 2px; }
    .team-row { display: flex; justify-content: space-between; align-items: center; gap: 2px; }
    .team-row.winner { font-weight: 800; color: #fff; }
    .team-row.loser { color: #64748b; }
    .team-info { display: flex; align-items: center; gap: 3px; flex: 1; min-width: 0; overflow: hidden; }
    .team-rank { font-size: 0.55rem; color: #84cc16; font-weight: 800; flex-shrink: 0; }
    .team-abbr { font-weight: 700; font-size: 0.75rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .team-record { font-size: 0.6rem; color: #94a3b8; font-weight: 500; flex-shrink: 0; margin-left: 2px; }
    .team-score { font-weight: 800; font-size: 0.8rem; font-variant-numeric: tabular-nums; min-width: 14px; text-align: right; }
    .no-games { grid-column: 1 / -1; display: flex; align-items: center; justify-content: center; color: #64748b; font-size: 0.85rem; font-weight: 600; padding: 16px; }
  </style>
</head>
<body>
  <header>
    <div class="header-left">
      <button class="menu-btn" onclick="toggleMenu()" aria-label="Toggle Menu"><span></span><span></span><span></span></button>
      <div class="title">Game Grid</div>
    </div>
    <div class="meta-info">
      <button id="fontToggleBtn" class="dyslexia-toggle" onclick="toggleDyslexiaFont()">Kate Button: OFF</button>
      <span class="live-badge"><span class="pulse-dot"></span> <span id="live-count">0</span> LIVE</span>
      <span id="last-updated">Updating...</span>
    </div>
  </header>

  <div id="grid-container"></div>

  <script>
    function updateToggleButtonState() {
      const btn = document.getElementById('fontToggleBtn');
      if (!btn) return;
      const on = localStorage.getItem('dyslexiaMode') === 'enabled';
      btn.innerText = on ? 'Kate Button: ON' : 'Kate Button: OFF';
      btn.style.borderColor = on ? '#38bdf8' : '#334155';
    }

    function toggleDyslexiaFont() {
      const on = localStorage.getItem('dyslexiaMode') === 'enabled';
      localStorage.setItem('dyslexiaMode', on ? 'disabled' : 'enabled');
      document.body.classList.toggle('dyslexia-font', !on);
      document.documentElement.classList.toggle('dyslexia-font', !on);
      updateToggleButtonState();
    }

    document.addEventListener('DOMContentLoaded', updateToggleButtonState);

    const API_URL = 'https://site.api.espn.com/apis/site/v2/sports/football/college-football/scoreboard?limit=300&groups=80';

    function isSEC(g) {
      return g.competitions[0].competitors.some(c => {
        const id = String(c.team?.conferenceId || c.team?.conference?.id || '');
        const a = String(c.team?.conference?.abbreviation || '').toUpperCase();
        const n = String(c.team?.conference?.name || '').toLowerCase();
        return id === '8' || a === 'SEC' || n.includes('sec') || n.includes('southeastern');
      });
    }

    function getHighestRank(g) {
      let best = 99;
      g.competitions[0].competitors.forEach(c => {
        const r = c.curatedRank?.current;
        if (r && r > 0 && r < best) {
          best = r;
        }
      });
      return best <= 25 ? best : 99;
    }

    function getConfKey(t) {
      if (!t) return 'other';
      const id = String(t.conferenceId || t.conference?.id || '');

      if (id === '8')   return 'sec';
      if (id === '5')   return 'btn';
      if (id === '4')   return 'b12';
      if (id === '1')   return 'acc';
      if (id === '151') return 'aac';
      if (id === '12')  return 'cusa';
      if (id === '15')  return 'mac';
      if (id === '17')  return 'mwc';
      if (id === '9')   return 'pac12';
      if (id === '37')  return 'sbc';
      if (id === '18')  return 'indep';
      
      return 'other';
    }
      
    function getGamePriority(g) {
      if (isSEC(g)) return 1;

      const rank = getHighestRank(g);
      if (rank <= 25) {
        return 2 + rank;
      }

      const keys = g.competitions[0].competitors.map(c => getConfKey(c.team));
      const tiers = ['btn', 'b12', 'acc', 'aac', 'cusa', 'mac', 'mwc', 'pac12', 'sbc'];
      
      for (let i = 0; i < tiers.length; i++) {
        if (keys.includes(tiers[i])) return 30 + i;
      }

      return 100;
    }

    function getGameSortTag(g) {
      if (isSEC(g)) return 'SEC';
      const rank = getHighestRank(g);
      if (rank <= 25) return `RNK`;
      
      const keys = g.competitions[0].competitors.map(c => getConfKey(c.team));
      const tiers = ['btn', 'b12', 'acc', 'aac', 'cusa', 'mac', 'mwc', 'pac12', 'sbc'];
      const tags  = ['BTN', 'B12', 'ACC', 'AAC', 'CUSA', 'MAC', 'MWC', 'PAC12', 'SBC'];
      for (let i = 0; i < tiers.length; i++) {
        if (keys.includes(tiers[i])) return tags[i];
      }
      return 'OTHR';
    }

    function sortGamesList(list) {
      return list.sort((a, b) => {
        const pA = getGamePriority(a), pB = getGamePriority(b);
        return pA !== pB ? pA - pB : new Date(a.date) - new Date(b.date);
      });
    }

    function formatShortStatus(detail, state) {
      if (!detail) return '';
      if (state === 'post') return detail.includes('OT') ? 'FINAL/OT' : 'FINAL';
      return detail.replace(/ - /g, ' ').replace(/1st Quarter/g, '1Q').replace(/2nd Quarter/g, '2Q').replace(/3rd Quarter/g, '3Q').replace(/4th Quarter/g, '4Q').replace(/End of 1st Quarter/g, 'End 1Q').replace(/End of 2nd Quarter/g, 'Half').replace(/End of 3rd Quarter/g, 'End 3Q').replace(/End of 4th Quarter/g, 'End 4Q').replace(/Halftime/g, 'Half');
    }

    async function fetchLiveGrid() {
      try {
        const res = await fetch(API_URL);
        const data = await res.json();
        const active = sortGamesList((data.events || []).filter(e => e.status.type.state === 'in'));
        const completed = sortGamesList((data.events || []).filter(e => e.status.type.state === 'post'));
        document.getElementById('live-count').innerText = active.length;
        document.getElementById('last-updated').innerText = `Updated: ${new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' })}`;
        renderGrid(active, completed);
      } catch (err) { console.error('Error:', err); }
    }

    function getTeamRecord(competitor) {
      if (!competitor.records) return '';
      const totalRecord = competitor.records.find(r => r.type === 'total') || competitor.records[0];
      return totalRecord ? totalRecord.summary : '';
    }

    function createGameCard(game, isCompleted) {
      const comp = game.competitions[0];
      const home = comp.competitors.find(c => c.homeAway === 'home');
      const away = comp.competitors.find(c => c.homeAway === 'away');
      
      let broadcast = comp.broadcasts?.[0]?.names?.[0] || '';
      broadcast = broadcast.replace(/ACC Network/gi, 'ACCN').replace(/SEC Network/gi, 'SECN');

      const sec = isSEC(game);
      const aClass = isCompleted ? (away.winner ? 'winner' : 'loser') : '';
      const hClass = isCompleted ? (home.winner ? 'winner' : 'loser') : '';
      const sortTagHtml = isCompleted ? `<span class="sort-tag">${getGameSortTag(game)}</span>` : '';

      const awayRecord = getTeamRecord(away);
      const homeRecord = getTeamRecord(home);

      const card = document.createElement('div');
      card.className = `game-card ${sec ? 'sec-game' : ''} ${isCompleted ? 'completed-card' : ''}`;
      card.innerHTML = `
        <div class="card-header">
          <span class="clock-status ${isCompleted ? 'completed-status' : ''}">${formatShortStatus(game.status.type.detail, game.status.type.state)}</span>
          <span class="broadcast">${sortTagHtml} ${broadcast}</span>
        </div>
        <div class="teams-container">
          <div class="team-row ${aClass}">
            <div class="team-info">
              ${away.curatedRank?.current <= 25 ? `<span class="team-rank">#${away.curatedRank.current}</span>` : ''}
              <span class="team-abbr">${away.team.abbreviation || away.team.name}</span>
              ${awayRecord ? `<span class="team-record">(${awayRecord})</span>` : ''}
            </div>
            <span class="team-score">${away.score}</span>
          </div>
          <div class="team-row ${hClass}">
            <div class="team-info">
              ${home.curatedRank?.current <= 25 ? `<span class="team-rank">#${home.curatedRank.current}</span>` : ''}
              <span class="team-abbr">${home.team.abbreviation || home.team.name}</span>
              ${homeRecord ? `<span class="team-record">(${homeRecord})</span>` : ''}
            </div>
            <span class="team-score">${home.score}</span>
          </div>
        </div>`;
      return card;
    }

    function renderGrid(activeGames, completedGames) {
      const container = document.getElementById('grid-container');
      container.innerHTML = '';
      const liveHeader = document.createElement('div');
      liveHeader.className = 'section-divider';
      liveHeader.innerHTML = `<span>Live Games</span><span>(${activeGames.length})</span>`;
      container.appendChild(liveHeader);

      if (!activeGames.length) {
        const noLive = document.createElement('div');
        noLive.className = 'no-games';
        noLive.innerText = 'No live games in progress.';
        container.appendChild(noLive);
      } else {
        activeGames.forEach(g => container.appendChild(createGameCard(g, false)));
      }

      if (completedGames.length) {
        const compHeader = document.createElement('div');
        compHeader.className = 'section-divider completed-title';
        compHeader.innerHTML = `<span>Completed Games</span><span>(${completedGames.length})</span>`;
        container.appendChild(compHeader);
        completedGames.forEach(g => container.appendChild(createGameCard(g, true)));
      }
    }

    fetchLiveGrid();
    setInterval(fetchLiveGrid, 15000);
  </script>
</body>
</html>
