  <script>
    async function fetchScores() {
      const statusElement = document.getElementById("update-status");
      statusElement.innerText = "Refreshing...";
      
      try {
        const response = await fetch("https://site.api.espn.com/apis/site/v2/sports/football/college-football/scoreboard?groups=80&limit=300");
        const data = await response.json();

        const liveGames = [];
        const upcomingGames = [];
        const recentFinalGames = [];
        const now = new Date();

        data.events.forEach(event => {
          const comp = event.competitions[0];
          const home = comp.competitors.find(c => c.homeAway === 'home');
          const away = comp.competitors.find(c => c.homeAway === 'away');
          
          const statusState = event.status.type.state; 
          const period = event.status.period;
          const homeScore = parseInt(home.score || "0");
          const awayScore = parseInt(away.score || "0");
          const diff = Math.abs(homeScore - awayScore);

          const isSecGame = (home.team.conferenceId === "8" || away.team.conferenceId === "8");
          
          const homeRankNum = home.curatedRank && home.curatedRank.current;
          const awayRankNum = away.curatedRank && away.curatedRank.current;
          const hasRankedTeam = (homeRankNum && homeRankNum <= 25) || (awayRankNum && awayRankNum <= 25);

          let bestRank = 99;
          if (homeRankNum && homeRankNum <= 25) bestRank = Math.min(bestRank, homeRankNum);
          if (awayRankNum && awayRankNum <= 25) bestRank = Math.min(bestRank, awayRankNum);

          const getRank = (c) => {
            const r = c.curatedRank && c.curatedRank.current;
            return (r && r <= 25) ? `<span style="color:#fbbf24; font-weight:bold;">#${r}</span> ` : '';
          };

          const tvNetwork = (comp.broadcasts && comp.broadcasts.length > 0 && comp.broadcasts[0].names)
            ? comp.broadcasts[0].names[0] 
            : "TV TBD";

          let spread = '';
          if (comp.odds && comp.odds.length > 0) {
            const oddsObj = comp.odds[0];
            if (oddsObj.details && oddsObj.details !== 'null' && oddsObj.details !== 'EVEN') {
              spread = oddsObj.details;
            } else if (oddsObj.summary) {
              spread = oddsObj.summary;
            }
          }

          const situation = comp.situation;
          let possessionTeamId = null;
          let driveText = '';

          if (statusState === 'in' && situation) {
            possessionTeamId = situation.possession;

            const down = situation.down;
            const distance = situation.distance;
            const posText = situation.possessionText || '';

            let downText = '';
            if (situation.downText && !situation.downText.includes('-1')) {
              downText = situation.downText;
            } else if (down && down > 0 && distance && distance > 0) {
              downText = `${down} & ${distance}`;
            }
            
            if (downText || (posText && !posText.includes('-1'))) {
              driveText = `${downText}${downText && posText ? ' at ' : ''}${posText}`;
            }
          }

          let winProbText = '';
          if (situation && situation.lastPlay && situation.lastPlay.probability) {
            const prob = situation.lastPlay.probability;
            const homeWp = Math.round(prob.homeWinPercentage * 100);
            const awayWp = 100 - homeWp;
            if (homeWp >= awayWp) {
              winProbText = `${home.team.abbreviation || 'HOME'} ${homeWp}%`;
            } else {
              winProbText = `${away.team.abbreviation || 'AWAY'} ${awayWp}%`;
            }
          } else if (situation && typeof situation.homeWinPercentage !== 'undefined') {
            const homeWp = Math.round(situation.homeWinPercentage * 100);
            const awayWp = 100 - homeWp;
            if (homeWp >= awayWp) {
              winProbText = `${home.team.abbreviation || 'HOME'} ${homeWp}%`;
            } else {
              winProbText = `${away.team.abbreviation || 'AWAY'} ${awayWp}%`;
            }
          }

          const gameDate = new Date(event.date);

          // Calculate end of the game week (Monday at 11:59:59 PM)
          const endOfWeekMonday = new Date(gameDate);
          const dayOfWeek = gameDate.getDay(); // 0 = Sun, 1 = Mon, ..., 6 = Sat
          const daysUntilMonday = (1 - dayOfWeek + 7) % 7;
          endOfWeekMonday.setDate(gameDate.getDate() + daysUntilMonday);
          endOfWeekMonday.setHours(23, 59, 59, 999);

          const gameObj = {
            gameId: event.id,
            homeId: home.id,
            awayId: away.id,
            homeTeam: home.team.shortDisplayName || home.team.name,
            awayTeam: away.team.shortDisplayName || away.team.name,
            homeRank: getRank(home),
            awayRank: getRank(away),
            homeScore,
            awayScore,
            statusState,
            statusDetail: event.status.type.shortDetail,
            period,
            diff,
            isSecGame,
            hasRankedTeam,
            bestRank,
            tvNetwork,
            spread,
            winProbText,
            possessionTeamId,
            driveText,
            gameDate,
            priority: 0
          };

          if (statusState === 'pre') {
            upcomingGames.push(gameObj);
          } else if (statusState === 'in') {
            gameObj.priority = 20000;
            liveGames.push(gameObj);
          } else if (statusState === 'post') {
            // Keep in "Completed Games" section until Monday 11:59 PM passes
            if (now <= endOfWeekMonday) {
              recentFinalGames.push(gameObj);
            }
          }
        });

        // Sort upcoming games chronologically / by tier
        upcomingGames.sort((a, b) => {
          const dateA = a.gameDate.toDateString();
          const dateB = b.gameDate.toDateString();
          if (dateA !== dateB) {
            return a.gameDate - b.gameDate;
          }
          const getUpcomingTier = (g) => g.isSecGame ? 1 : (g.hasRankedTeam ? 2 : 3);
          const tierA = getUpcomingTier(a);
          const tierB = getUpcomingTier(b);
          if (tierA !== tierB) return tierA - tierB;
          if (a.gameDate.getTime() !== b.gameDate.getTime()) return a.gameDate - b.gameDate;
          return a.bestRank - b.bestRank;
        });

        renderGames(liveGames, upcomingGames, recentFinalGames);
        statusElement.innerText = "Live • 30s";
      } catch (err) {
        statusElement.innerText = "Error Loading";
      }
    }

    function renderGames(liveGames, upcomingGames, recentFinalGames) {
      const container = document.getElementById("games-container");
      container.innerHTML = "";

      if (liveGames.length === 0 && upcomingGames.length === 0 && recentFinalGames.length === 0) {
        container.innerHTML = "<p>No games found.</p>";
        return;
      }

      // 1. Render Live Games First
      liveGames.forEach(game => {
        container.appendChild(createGameCard(game));
      });

      // 2. Group & Render Upcoming Games by Day
      if (upcomingGames.length > 0) {
        const gamesByDay = {};
        upcomingGames.forEach(game => {
          const dayString = game.gameDate.toDateString();
          if (!gamesByDay[dayString]) gamesByDay[dayString] = [];
          gamesByDay[dayString].push(game);
        });

        Object.keys(gamesByDay).forEach(dayString => {
          const dayGames = gamesByDay[dayString];
          const firstGame = dayGames[0];

          const dayLabel = firstGame.gameDate.toLocaleDateString('en-US', {
            weekday: 'long',
            month: 'short',
            day: 'numeric'
          });

          const dayHeader = document.createElement("div");
          dayHeader.className = "day-header";
          dayHeader.innerText = dayLabel;
          container.appendChild(dayHeader);

          const isSaturday = firstGame.gameDate.getDay() === 6;

          if (isSaturday) {
            const secGames = dayGames.filter(g => g.isSecGame);
            const rankedGames = dayGames.filter(g => !g.isSecGame && g.hasRankedTeam);
            const otherGames = dayGames.filter(g => !g.isSecGame && !g.hasRankedTeam);

            if (secGames.length > 0) {
              const tierHeader = document.createElement("div");
              tierHeader.className = "tier-header";
              tierHeader.innerText = "SEC Games - sorted by start time";
              container.appendChild(tierHeader);
              secGames.forEach(game => container.appendChild(createGameCard(game)));
            }

            if (rankedGames.length > 0) {
              const tierHeader = document.createElement("div");
              tierHeader.className = "tier-header";
              tierHeader.innerText = "Ranked Matchups - sorted by time";
              container.appendChild(tierHeader);
              rankedGames.forEach(game => container.appendChild(createGameCard(game)));
            }

            if (otherGames.length > 0) {
              const tierHeader = document.createElement("div");
              tierHeader.className = "tier-header";
              tierHeader.innerText = "All Other Matchups - sorted by time";
              container.appendChild(tierHeader);
              otherGames.forEach(game => container.appendChild(createGameCard(game)));
            }

          } else {
            dayGames.forEach(game => container.appendChild(createGameCard(game)));
          }
        });
      }

      // 3. Render Completed / Final Games at the very bottom
      if (recentFinalGames.length > 0) {
        const finalHeader = document.createElement("div");
        finalHeader.className = "tier-header";
        finalHeader.innerText = "Completed Games";
        container.appendChild(finalHeader);

        recentFinalGames.forEach(game => {
          container.appendChild(createGameCard(game));
        });
      }
    }

    function createGameCard(game) {
      const card = document.createElement("div");
      card.className = "game-card";
      if (game.statusState === 'in' && game.period >= 4) {
        card.classList.add("live-4q");
      } else if (game.statusState === 'in') {
        card.classList.add("live");
      }

      const posId = String(game.possessionTeamId || '');
      const homeId = String(game.homeId || '');
      const awayId = String(game.awayId || '');

      const isAwayPossession = posId && posId === awayId;
      const isHomePossession = posId && posId === homeId;

      card.innerHTML = `
        <div class="card-header">
          <span>${game.statusDetail} ${game.isSecGame ? '<strong style="color:#fff; background:#5d1725; padding:1px 5px; border-radius:3px; font-size:0.7rem;">SEC</strong>' : ''}</span>
          <span class="header-right">
            <strong style="color:#fbbf24;">📺 ${game.tvNetwork}</strong>
            <a href="https://www.espn.com/college-football/game/_/gameId/${game.gameId}" 
               target="_blank" 
               rel="noopener noreferrer" 
               class="watch-btn">
              Gamecast
            </a>
          </span>
        </div>
        <div class="team-row">
          <span>${isAwayPossession ? '🏈 ' : ''}${game.awayRank}${game.awayTeam}</span>
          <span class="score">${game.statusState === 'pre' ? '' : game.awayScore}</span>
        </div>
        <div class="team-row">
          <span>${isHomePossession ? '🏈 ' : ''}${game.homeRank}${game.homeTeam}</span>
          <span class="score">${game.statusState === 'pre' ? '' : game.homeScore}</span>
        </div>
        ${game.driveText ? `<div class="drive-banner">Drive: ${game.driveText}</div>` : ''}
        ${(game.spread || game.winProbText) ? `
        <div class="game-meta">
          <span>${game.spread ? `<strong>Line:</strong> ${game.spread}` : ''}</span>
          <span>${game.winProbText ? `<strong>Win Prob:</strong> ${game.winProbText}` : ''}</span>
        </div>
        ` : ''}
      `;
      return card;
    }

    fetchScores();
    setInterval(fetchScores, 30000);
  </script>
