<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bully's CFB Board</title>
  <script src="nav.js"></script>
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-8695308WQ8"></script>
  <script>
    window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments);}
    gtag('js',new Date());gtag('config','G-8695308WQ8');
    if(localStorage.getItem('dyslexiaMode')==='enabled')document.documentElement.classList.add('dyslexia-font');
  </script>
  <style>
    :root{--bg:#0b0c10;--card:#181920;--border:#272935;--text:#f8fafc;--maroon:#5d1725;--red:#ef4444;--sub:#94a3b8;--gold:#84cc16;}
    *{box-sizing:border-box;}
    body{font-family:system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);margin:0;padding:16px;}
    body.dyslexia-font,body.dyslexia-font *{font-family:"Comic Sans MS",Verdana,sans-serif!important;letter-spacing:.05em!important;word-spacing:.1em!important;}
    .dyslexia-toggle{background:#181920;border:1px solid var(--border);color:#38bdf8;font-size:.75rem;font-weight:700;padding:5px 10px;border-radius:6px;cursor:pointer;}
    header{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:20px;padding-bottom:12px;border-bottom:2px solid var(--maroon);}
    .header-left,.header-right,.header-title,.card-header-right{display:flex;align-items:center;gap:8px;}
    .header-left{gap:12px;}
    .menu-btn{background:none;border:none;cursor:pointer;display:flex;flex-direction:column;justify-content:space-between;width:22px;height:18px;padding:0;z-index:101;}
    .menu-btn span{display:block;width:100%;height:2px;background:#38bdf8;border-radius:2px;}
    .nav-overlay{position:fixed;top:0;left:0;width:100vw;height:100vh;background:rgba(0,0,0,0.6);z-index:99;opacity:0;visibility:hidden;pointer-events:none;transition:0.2s;}
    .nav-overlay.open{opacity:1;visibility:visible;pointer-events:auto;}
    .nav-drawer{position:fixed;top:0;left:-260px;width:260px;height:100vh;background:#181920;border-right:1px solid var(--border);z-index:100;display:flex;flex-direction:column;transition:0.3s;box-shadow:4px 0 15px rgba(0,0,0,0.5);}
    .nav-drawer.open{left:0;}
    .drawer-header{padding:14px 16px;font-weight:800;font-size:.9rem;text-transform:uppercase;color:#38bdf8;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;}
    .drawer-close{background:none;border:none;color:var(--sub);font-size:1.3rem;cursor:pointer;}
    .drawer-links{list-style:none;padding:8px 0;margin:0;display:flex;flex-direction:column;}
    .drawer-links a{padding:12px 18px;color:var(--text);text-decoration:none;font-size:.85rem;font-weight:700;display:block;border-left:3px solid transparent;}
    .drawer-links a:hover,.drawer-links a.active{background:#222530;border-left-color:#38bdf8;color:#38bdf8;}
    .msu-logo{height:38px;width:auto;object-fit:contain;filter:drop-shadow(0 0 2px #fff);}
    h1{margin:0;font-size:1.25rem;font-weight:800;}
    .status-badge{font-size:.75rem;padding:4px 10px;background:#222530;border:1px solid var(--border);border-radius:12px;color:var(--sub);}
    .day-header{font-size:1.05rem;font-weight:800;background:#12131a;border-left:4px solid var(--maroon);padding:8px 12px;margin:24px 0 10px;border-radius:4px;}
    .tier-header{font-size:.8rem;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--gold);margin:14px 0 8px 4px;padding-bottom:4px;border-bottom:1px solid #222530;}
    .game-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:12px;border-left:5px solid var(--border);box-shadow:0 4px 12px rgba(0,0,0,.4);}
    .game-card.live-4q{border-left-color:var(--red);background:linear-gradient(135deg,#181920 0%,#221518 100%);}
    .game-card.live{border-left-color:var(--maroon);background:linear-gradient(135deg,#181920 0%,#1f1418 100%);}
    .game-card.completed-card{opacity:.85;background:#172033;}
    .card-header{display:flex;justify-content:space-between;align-items:center;font-size:.85rem;color:var(--sub);margin-bottom:8px;}
    .team-row{display:flex;justify-content:space-between;align-items:center;margin:6px 0;font-size:1.1rem;font-weight:600;}
    .team-row.winner{font-weight:800;color:#fff;}
    .team-row.loser{color:#64748b;}
    .score{font-size:1.25rem;font-weight:bold;}
    .sort-tag{background:#334155;color:#38bdf8;font-size:.6rem;padding:2px 5px;border-radius:3px;font-weight:700;margin-right:6px;}
    .conf-tag{background:#272935;color:var(--sub);font-size:.6rem;padding:2px 5px;border-radius:3px;font-weight:700;margin-right:6px;border:1px solid #334155;}
    .drive-banner{font-size:.75rem;color:#38bdf8;background:rgba(56,189,248,.1);border:1px solid rgba(56,189,248,.2);padding:4px 8px;border-radius:6px;margin:8px 0;font-weight:600;}
    .watch-btn{color:#fff;text-decoration:none;font-weight:bold;font-size:.75rem;background:var(--maroon);border:1px solid #7d2033;padding:3px 8px;border-radius:4px;}
    .intensity-container{display:flex;align-items:center;gap:10px;background:#111319;border:1px solid var(--border);border-radius:8px;padding:6px 12px;}
    .gauge-wrapper{position:relative;width:54px;height:30px;flex-shrink:0;}
    .gauge-svg{width:100%;height:100%;overflow:visible;}
    .intensity-text-group{display:flex;flex-direction:column;}
    .intensity-label{font-size:.75rem;font-weight:800;text-transform:uppercase;letter-spacing:.04em;}
    .intensity-score{font-size:.65rem;color:var(--sub);font-weight:600;}
    .card-footer-flex {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-top: 8px;
      padding-top: 6px;
      border-top: 1px solid var(--border);
    }
    .card-footer-flex .intensity-container {
      margin-top: 0;
      flex-grow: 1;
    }
    .win-prob-badge {
      font-size: .75rem;
      color: var(--sub);
      background: #111319;
      border: 1px solid var(--border);
      padding: 8px 10px;
      border-radius: 8px;
      white-space: nowrap;
      text-align: center;
    }
  </style>
</head>
<body>
  <header>
    <div class="header-left">
      <button class="menu-btn" onclick="toggleMenu()" aria-label="Toggle Menu"><span></span><span></span><span></span></button>
      <div class="header-title">
        <img src="https://a.espncdn.com/combiner/i?img=/i/teamlogos/ncaa/500/344.png&h=100&w=100" alt="MSU Logo" class="msu-logo">
        <h1>Bully's CFB Board</h1>
      </div>
    </div>
    <div class="header-right">
      <button id="fontToggleBtn" class="dyslexia-toggle" onclick="toggleDyslexiaFont()">Kate Button: OFF</button>
      <span id="update-status" class="status-badge">Loading...</span>
    </div>
  </header>
  
  <div id="games-container"></div>

  <script>
    function updateToggleButtonState() {
      const btn = document.getElementById('fontToggleBtn');
      if (!btn) return;
      const active = localStorage.getItem('dyslexiaMode') === 'enabled';
      btn.innerText = active ? 'Kate Button: ON' : 'Kate Button: OFF';
      btn.style.borderColor = active ? '#38bdf8' : '#334155';
    }

    function toggleDyslexiaFont() {
      const active = localStorage.getItem('dyslexiaMode') === 'enabled';
      localStorage.setItem('dyslexiaMode', active ? 'disabled' : 'enabled');
      document.body.classList.toggle('dyslexia-font', !active);
      document.documentElement.classList.toggle('dyslexia-font', !active);
      updateToggleButtonState();
    }

    document.addEventListener('DOMContentLoaded', () => {
      updateToggleButtonState();
      if (localStorage.getItem('dyslexiaMode') === 'enabled') document.body.classList.add('dyslexia-font');
    });

    const isSEC = g => g.rawEvent.competitions[0].competitors.some(c => String(c.team?.conferenceId || c.team?.conference?.id) === '8');
    const isRanked = g => g.hasRanked;

    function getConfKey(t) {
      if (!t) return 'other';
      const id = String(t.conferenceId || t.conference?.id || '');
      const name = String(t.conference?.name || t.conference?.abbreviation || t.conference || '').toLowerCase();
      
      if (id === '8' || name.includes('sec')) return 'sec';
      if (id === '5' || name.includes('big ten') || name.includes('b1g')) return 'bigten';
      if (id === '4' || id === '151' || name.includes('big 12')) return 'big12';
      if (id === '1' || name.includes('acc')) return 'acc';
      return 'other';
    }

    function getGameConfTier(g) {
      const confs = g.rawEvent.competitions[0].competitors.map(c => getConfKey(c.team));
      if (confs.includes('sec')) return 1;
      if (confs.includes('bigten')) return 2;
      if (confs.includes('big12')) return 3;
      if (confs.includes('acc')) return 4;
      return 5;
    }

    function getGameSortTag(g) {
      if (isSEC(g)) return 'SEC';
      if (isRanked(g)) return 'RNK';
      const t = getGameConfTier(g);
      return t === 2 ? 'BTN' : t === 3 ? 'B12' : t === 4 ? 'ACC' : 'OTHR';
    }

    function sortCompletedGames(games) {
      return games.sort((a, b) => (isSEC(b) - isSEC(a)) || (isRanked(b) - isRanked(b)) || (getGameConfTier(a) - getGameConfTier(b)) || (a.gDate - b.gDate));
    }

    function calculateLivePriorityScore(g) {
      const comp = g.rawEvent?.competitions?.[0];
      const home = comp?.competitors?.find(c => c.homeAway === 'home');
      const away = comp?.competitors?.find(c => c.homeAway === 'away');
      
      const homeConfId = String(home?.team?.conferenceId || home?.team?.conference?.id || '');
      const awayConfId = String(away?.team?.conferenceId || away?.team?.conference?.id || '');
      
      const homeIsSec = homeConfId === '8';
      const awayIsSec = awayConfId === '8';
      
      const hRank = home?.curatedRank?.current;
      const aRank = away?.curatedRank?.current;
      const hRnk = hRank && hRank <= 25 ? hRank : 99;
      const aRnk = aRank && aRank <= 25 ? aRank : 99;

      const homeScore = parseInt(g.homeScore || 0);
      const awayScore = parseInt(g.awayScore || 0);
      const margin = Math.abs(homeScore - awayScore);
      const p = g.period || 1;

      // --- UPSET & LATE-GAME THRILLER CHECK ---
      let upsetBonus = 0;
      let isUpsetAlert = false;

      if (hRnk <= 25) {
        const deficit = awayScore - homeScore; 
        const lead = homeScore - awayScore;   
        
        if (deficit >= 10) {
          isUpsetAlert = true;
          upsetBonus = hRnk <= 10 ? 900 : 500;
        } else if (deficit > 0) {
          isUpsetAlert = true;
          upsetBonus = hRnk <= 10 ? 500 : 300;
        }
        
        if (hRnk <= 10 && p >= 3 && lead <= 7) {
          isUpsetAlert = true;
          upsetBonus = Math.max(upsetBonus, 650);
        }
      } 
      else if (aRnk <= 25) {
        const deficit = homeScore - awayScore; 
        const lead = awayScore - homeScore;   

        if (deficit >= 10) {
          isUpsetAlert = true;
          upsetBonus = aRnk <= 10 ? 900 : 500;
        } else if (deficit > 0) {
          isUpsetAlert = true;
          upsetBonus = aRnk <= 10 ? 500 : 300;
        }

        if (aRnk <= 10 && p >= 3 && lead <= 7) {
          isUpsetAlert = true;
          upsetBonus = Math.max(upsetBonus, 650);
        }
      }

      // --- MATCHUP BASE SCORE TIERS ---
      let base = 200; // Default: All others
      
      const powerIds = ['8', '5', '4', '11', '151']; // SEC (8), Big Ten (5), Big 12 (4 or 151), ACC (1)
      const isPower4Team = id => ['8', '5', '4', '1', '151'].includes(id);

      if (homeIsSec && awayIsSec) {
        base = 1200; // 1. SEC vs SEC
      } else if (hRnk <= 25 && aRnk <= 25) {
        base = 1000; // 2. Ranked vs Ranked
      } else if (hRnk <= 25 || aRnk <= 25) {
        base = 800;  // 3. Ranked vs Anyone else
      } else if (isPower4Team(homeConfId) && isPower4Team(awayConfId)) {
        base = 500;  // 4. Power 4 vs Power 4 (IDs 8, 5, 4, 1)
      } else {
        base = 200;  // 5. All others
      }

      // 2. Tighter Margin Bonus
      const marginBonus = margin <= 16 ? Math.round((16 - margin) * 6.25) : 0;

      // 3. Time / Clock Progression Factor
      let timeScore = 0;
      let rem = 900;
      const m = (g.statusDetail || '').match(/(\d+):(\d+)/);
      if (m) rem = parseInt(m[1]) * 60 + parseInt(m[2]);
      const quarterElapsed = 900 - rem;

      // --- BLOWOUT CHECK ---
      if (margin > 16 && !isUpsetAlert) {
        const blowoutScore = Math.round((base * 0.1));
        return blowoutScore;
      }

      if (p === 1) timeScore = Math.round((quarterElapsed / 900) * 25);
      else if (p === 2) timeScore = 25 + Math.round((quarterElapsed / 900) * 50);
      else if (p === 3) timeScore = 100 + Math.round((quarterElapsed / 900) * 100);
      else if (p === 4) timeScore = 300 + Math.round((quarterElapsed / 900) * 300);
      else if (p > 4) timeScore = 700;

      const rawScore = base + marginBonus + timeScore;

      return rawScore + upsetBonus;
    }
    
    function renderIntensityMeter(rawScore) {
      const displayScore = Math.min(Math.max(Math.round((rawScore / 1600) * 10), 0), 10);

      let label = 'Snoozefest', color = '#ef4444', angle = -40;

      if (displayScore >= 9) {
        label = 'TURN TV ON NOW!';
        color = '#84cc16';
        angle = 55;
      } else if (displayScore >= 6) {
        label = 'Great Game';
        color = '#22c55e';
        angle = 25;
      } else if (displayScore >= 3) {
        label = 'Watchable';
        color = '#eab308';
        angle = 0;
      } else {
        label = 'Snoozefest';
        color = '#ef4444';
        angle = -40;
      }

      return `
        <div class="intensity-container">
          <div class="gauge-wrapper">
            <svg class="gauge-svg" viewBox="0 0 100 55">
              <path d="M 10 50 A 40 40 0 0 1 33.4 18.2" fill="none" stroke="#ef4444" stroke-width="12"/>
              <path d="M 33.4 18.2 A 40 40 0 0 1 66.6 18.2" fill="none" stroke="#eab308" stroke-width="12"/>
              <path d="M 66.6 18.2 A 40 40 0 0 1 90 50" fill="none" stroke="#22c55e" stroke-width="12"/>
              <circle cx="50" cy="50" r="5" fill="#f8fafc"/>
              <g transform="rotate(${angle}, 50, 50)"><polygon points="47,50 53,50 50,14" fill="#f8fafc"/></g>
            </svg>
          </div>
          <div class="intensity-text-group">
            <span class="intensity-label" style="color:${color};">${label}</span>
            <span class="intensity-score">Intensity Score: ${displayScore}</span>
          </div>
        </div>`;
    }

    async function fetchScores() {
      const statusEl = document.getElementById("update-status");
      statusEl.innerText = "Refreshing...";
      try {
        const res = await fetch("https://site.api.espn.com/apis/site/v2/sports/football/college-football/scoreboard?groups=80&limit=300");
        const data = await res.json();
        const live = [], upcoming = [], finals = [], now = new Date();

        (data.events || []).forEach(e => {
          const comp = e.competitions?.[0]; if (!comp) return;
          const home = comp.competitors?.find(c => c.homeAway === 'home');
          const away = comp.competitors?.find(c => c.homeAway === 'away');
          if (!home || !away) return;

          const state = e.status?.type?.state;
          const isSec = comp.competitors.some(c => String(c.team?.conferenceId || c.team?.conference?.id) === "8");
          const hRank = home.curatedRank?.current, aRank = away.curatedRank?.current;
          const hasRanked = (hRank && hRank <= 25) || (aRank && aRank <= 25);
          let bestRank = Math.min(hRank <= 25 ? hRank : 99, aRank <= 25 ? aRank : 99);

          const tv = comp.broadcasts?.[0]?.names?.[0] || "TV TBD";
          let spread = comp.odds?.[0]?.details || comp.odds?.[0]?.summary || '';
          if (spread === 'null' || spread === 'EVEN') spread = '';

          // Keep clean conference ID tag on the card for your reference
          const hId = home.team?.conferenceId || home.team?.conference?.id || '?';
          const aId = away.team?.conferenceId || away.team?.conference?.id || '?';
          const confDisplayTag = hId === aId ? `Conf ID: ${hId}` : `IDs: A:${aId} H:${hId}`;

          const sit = comp.situation;
          let driveText = '';
          if (state === 'in' && sit) {
            const down = sit.down, dist = sit.distance, pos = sit.possessionText || '';
            let dt = sit.downText && !sit.downText.includes('-1') ? sit.downText : (down > 0 && dist > 0 ? `${down} & ${dist}` : '');
            if (dt || (pos && !pos.includes('-1'))) driveText = `${dt}${dt && pos ? ' at ' : ''}${pos}`;
          }

          let winProb = '';
          if (sit?.lastPlay?.probability) {
            const wp = Math.round((sit.lastPlay.probability.homeWinPercentage || 0) * 100);
            winProb = wp >= 50 ? `${home.team?.abbreviation || 'HOME'} ${wp}%` : `${away.team?.abbreviation || 'AWAY'} ${100 - wp}%`;
          }

          const gDate = new Date(e.date);
          const monEnd = new Date(gDate);
          monEnd.setDate(gDate.getDate() + ((1 - gDate.getDay() + 7) % 7));
          monEnd.setHours(23, 59, 59, 999);

          const gameObj = {
            id: e.id, homeId: home.id, awayId: away.id,
            homeTeam: home.team?.shortDisplayName || home.team?.name || 'Home',
            awayTeam: away.team?.shortDisplayName || away.team?.name || 'Away',
            homeRank: hRank && hRank <= 25 ? `<span style="color:#84cc16;font-weight:bold;">#${hRank}</span> ` : '',
            awayRank: aRank && aRank <= 25 ? `<span style="color:#84cc16;font-weight:bold;">#${aRank}</span> ` : '',
            homeScore: home.score || "0", awayScore: away.score || "0",
            homeWinner: home.winner, awayWinner: away.winner,
            state, statusDetail: e.status?.type?.shortDetail || '', period: e.status?.period || 0,
            isSec, hasRanked, bestRank, tv, spread, winProb, confDisplayTag,
            posId: String(sit?.possession || ''), driveText, gDate, rawEvent: e
          };

          if (state === 'in') {
            gameObj.priorityScore = calculateLivePriorityScore(gameObj);
            live.push(gameObj);
          } else if (state === 'pre') {
            upcoming.push(gameObj);
          } else if (state === 'post' && now <= monEnd) {
            finals.push(gameObj);
          }
        });

        live.sort((a, b) => b.priorityScore - a.priorityScore || a.gDate - b.gDate);
        upcoming.sort((a, b) => a.gDate - b.gDate || (a.isSec ? 1 : 2) - (b.isSec ? 1 : 2));
        sortCompletedGames(finals);

        renderGames(live, upcoming, finals);
        statusEl.innerText = "Live • 30s";
      } catch (err) {
        statusEl.innerText = "Error Loading";
      }
    }

    function renderGames(live, upcoming, finals) {
      const container = document.getElementById("games-container");
      container.innerHTML = "";
      if (!live.length && !upcoming.length && !finals.length) {
        container.innerHTML = "<p>No games found.</p>"; return;
      }

      live.forEach(g => container.appendChild(createCard(g, false)));

      if (upcoming.length) {
        const byDay = {};
        upcoming.forEach(g => {
          const day = g.gDate.toDateString();
          (byDay[day] = byDay[day] || []).push(g);
        });

        Object.keys(byDay).forEach(day => {
          const dayGames = byDay[day];
          const dHeader = document.createElement("div");
          dHeader.className = "day-header";
          dHeader.innerText = dayGames[0].gDate.toLocaleDateString('en-US', { weekday: 'long', month: 'short', day: 'numeric' });
          container.appendChild(dHeader);

if (dayGames[0].gDate.getDay() === 6) {
            const sec = dayGames.filter(g => g.isSec);
            const ranked = dayGames.filter(g => !g.isSec && g.hasRanked);
            const other = dayGames.filter(g => !g.isSec && !g.hasRanked);

            const appendTier = (label, list) => {
              if (!list.length) return;
              const tHeader = document.createElement("div");
              tHeader.className = "tier-header";
              tHeader.innerText = label;
              container.appendChild(tHeader);
              list.forEach(g => container.appendChild(createCard(g, false)));
            };

            appendTier("SEC Games - sorted by start time", sec);
            appendTier("Ranked Matchups - sorted by time", ranked);
            appendTier("All Other Matchups - sorted by time", other);
          } else {
            dayGames.forEach(g => container.appendChild(createCard(g, false)));
          }
        });
      }

      if (finals.length) {
        const fHeader = document.createElement("div");
        fHeader.className = "tier-header";
        fHeader.innerText = "Completed Games";
        container.appendChild(fHeader);
        finals.forEach(g => container.appendChild(createCard(g, true)));
      }
    }

    function createCard(g, isCompleted = false) {
      const card = document.createElement("div");
      card.className = "game-card" + (isCompleted ? " completed-card" : "") + (g.state === 'in' ? (g.period >= 4 ? " live-4q" : " live") : "");

      const isAwayPos = g.posId && g.posId === String(g.awayId);
      const isHomePos = g.posId && g.posId === String(g.homeId);

      let awayClass = '', homeClass = '';
      if (isCompleted) {
        if (g.awayWinner) { awayClass = ' winner'; homeClass = ' loser'; }
        else if (g.homeWinner) { homeClass = ' winner'; awayClass = ' loser'; }
      }

      const hasIntensity = g.state === 'in' && typeof g.priorityScore === 'number';
      const hasMeta = g.spread || g.winProb;

      let footerHtml = '';
      if (hasIntensity || hasMeta) {
        footerHtml = `<div class="card-footer-flex">`;
        if (hasIntensity) {
          footerHtml += renderIntensityMeter(g.priorityScore);
        }
        if (hasMeta) {
          footerHtml += `<div class="win-prob-badge">${g.winProb ? `<span>${g.winProb}</span>` : (g.spread ? `<span>${g.spread}</span>` : '')}</div>`;
        }
        footerHtml += `</div>`;
      }

      card.innerHTML = `
        <div class="card-header">
          <span>${g.statusDetail}</span>
          <span class="card-header-right">
            <span class="conf-tag">${g.confDisplayTag}</span>
            <span class="broadcast">${isCompleted ? `<span class="sort-tag">${getGameSortTag(g)}</span>` : ''}<strong style="color:#84cc16;">📺 ${g.tv}</strong></span>
            <a href="https://www.espn.com/college-football/game/_/gameId/${g.id}" target="_blank" rel="noopener noreferrer" class="watch-btn">Gamecast</a>
          </span>
        </div>
        <div class="team-row${awayClass}"><span>${isAwayPos ? '🏈 ' : ''}${g.awayRank}${g.awayTeam}</span><span class="score">${g.state === 'pre' ? '' : g.awayScore}</span></div>
        <div class="team-row${homeClass}"><span>${isHomePos ? '🏈 ' : ''}${g.homeRank}${g.homeTeam}</span><span class="score">${g.state === 'pre' ? '' : g.homeScore}</span></div>
        ${g.driveText ? `<div class="drive-banner">Drive: ${g.driveText}</div>` : ''}
        ${footerHtml}
      `;
      return card;
    }

    fetchScores();
    setInterval(fetchScores, 30000);
  </script>
</body>
</html>
