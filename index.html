<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mississippi State Scores</title>
  <style>
    :root {
      --bg: #0b0c10;
      --card-bg: #181920;
      --card-border: #272935;
      --text: #f8fafc;
      --accent-maroon: #5d1725;
      --subtext: #94a3b8;
      --gold: #fbbf24;
      --win-green: #22c55e;
      --loss-red: #ef4444;
    }
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 12px;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 12px;
      padding-bottom: 8px;
      border-bottom: 2px solid var(--accent-maroon);
    }
    .header-title {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .msu-logo {
      height: 32px;
      width: auto;
      object-fit: contain;
      filter: 
        drop-shadow( 2px  0px 0px #ffffff)
        drop-shadow(-2px  0px 0px #ffffff)
        drop-shadow( 0px  2px 0px #ffffff)
        drop-shadow( 0px -2px 0px #ffffff);
    }
    h1 { margin: 0; font-size: 1rem; font-weight: 800; letter-spacing: -0.5px; }
    .nav-tabs {
      display: flex;
      gap: 6px;
    }
    .nav-tabs a {
      color: var(--subtext);
      text-decoration: none;
      font-size: 0.75rem;
      font-weight: 700;
      padding: 4px 8px;
      background: #181920;
      border: 1px solid var(--card-border);
      border-radius: 6px;
      transition: all 0.2s;
    }
    .nav-tabs a.active, .nav-tabs a:hover {
      color: #fff;
      background: var(--accent-maroon);
      border-color: #7d2033;
    }

    .scores-container {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .score-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      padding: 10px 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 2px 6px rgba(0,0,0,0.3);
    }
    .game-info {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .sport-tag {
      font-size: 0.65rem;
      color: var(--gold);
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .matchup {
      font-size: 0.9rem;
      font-weight: 700;
    }
    .game-status {
      font-size: 0.7rem;
      color: var(--subtext);
      font-weight: 600;
    }
    .score-right {
      text-align: right;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 2px;
    }
    .result-badge {
      font-weight: 800;
      font-size: 0.8rem;
      padding: 2px 6px;
      border-radius: 4px;
      display: inline-block;
    }
    .result-win { background: rgba(34, 197, 94, 0.2); color: var(--win-green); border: 1px solid rgba(34, 197, 94, 0.4); }
    .result-loss { background: rgba(239, 68, 68, 0.2); color: var(--loss-red); border: 1px solid rgba(239, 68, 68, 0.4); }
    .tv-tag {
      font-size: 0.65rem;
      color: var(--gold);
      font-weight: bold;
    }
  </style>
</head>
<body>

  <header>
    <div class="header-title">
      <img src="https://a.espncdn.com/combiner/i?img=/i/teamlogos/ncaa/500/344.png&h=100&w=100" 
           alt="MSU Logo" 
           class="msu-logo">
      <h1>MSU Scores</h1>
    </div>
    <nav class="nav-tabs">
      <a href="index.html" class="active">Scores</a>
      <a href="schedules.html">MSU Schedule</a>
      <a href="visit.html">MSU Trip</a>
    </nav>
  </header>

  <div id="scores-container" class="scores-container">
    <p style="color: var(--subtext); font-size: 0.8rem;">Loading recent and live scores...</p>
  </div>

  <!-- Include centralized dataset -->
  <script src="data.js"></script>

  <script>
    const sportLabels = {
      'football': 'Football',
      'mens-basketball': 'Men\'s Basketball',
      'womens-basketball': 'Women\'s Basketball',
      'baseball': 'Baseball',
      'softball': 'Softball'
    };

    const espnEndpoints = [
      { key: 'football', url: 'https://site.api.espn.com/apis/site/v2/sports/football/college-football/teams/344/schedule' },
      { key: 'mens-basketball', url: 'https://site.api.espn.com/apis/site/v2/sports/basketball/mens-college-basketball/teams/344/schedule' },
      { key: 'womens-basketball', url: 'https://site.api.espn.com/apis/site/v2/sports/basketball/womens-college-basketball/teams/344/schedule' },
      { key: 'baseball', url: 'https://site.api.espn.com/apis/site/v2/sports/baseball/college-baseball/teams/344/schedule' },
      { key: 'softball', url: 'https://site.api.espn.com/apis/site/v2/sports/baseball/college-softball/teams/344/schedule' }
    ];

    function extractBroadcastNetwork(comp) {
      if (!comp) return '';
      if (comp.broadcasts && comp.broadcasts.length > 0) {
        for (const b of comp.broadcasts) {
          if (b.media && b.media.shortName) return b.media.shortName;
          if (b.names && b.names[0]) return b.names[0];
          if (b.station) return b.station;
        }
      }
      if (comp.geoBroadcasts && comp.geoBroadcasts.length > 0) {
        for (const gb of comp.geoBroadcasts) {
          if (gb.media && gb.media.shortName) return gb.media.shortName;
          if (gb.type && gb.type.shortName) return gb.type.shortName;
        }
      }
      return '';
    }

    async function loadScores() {
      const container = document.getElementById("scores-container");
      let liveOrRecentGames = [];

      const now = new Date();
      // Cutoff time: Today at 11:00 AM
      const cutoff11amToday = new Date(now.getFullYear(), now.getMonth(), now.getDate(), 11, 0, 0);

      const promises = espnEndpoints.map(async (sport) => {
        try {
          const res = await fetch(sport.url);
          if (!res.ok) return;
          const data = await res.json();

          if (data && data.events) {
            data.events.forEach(event => {
              const comp = event.competitions[0];
              const msuComp = comp.competitors.find(c => c.id === '344');
              const oppComp = comp.competitors.find(c => c.id !== '344');
              if (!oppComp) return;

              const gameDate = new Date(event.date);
              const gameIso = event.date.split('T')[0];
              
              // Expiration check: Keep live games, games happening today, or completed games until 11:00 AM the next day
              const gameDayAfter = new Date(gameIso + 'T11:00:00');
              gameDayAfter.setDate(gameDayAfter.getDate() + 1);

              const gameState = event.status?.type?.state; // 'pre', 'in', 'post'

              // If it's a past game and current time is past 11:00 AM the day after, skip it
              if (gameState === 'post' && now > gameDayAfter) return;
              if (gameState === 'pre' && gameDate < cutoff11amToday && !isToday(gameDate)) return;

              let resultStr = null;
              if (gameState === 'post' && msuComp && oppComp) {
                const msuScore = parseInt(msuComp.score?.value || msuComp.score || "0");
                const oppScore = parseInt(oppComp.score?.value || oppComp.score || "0");
                const isWin = msuComp.winner ?? (msuScore > oppScore);
                resultStr = `${isWin ? 'W' : 'L'} ${msuScore}-${oppScore}`;
              } else if (gameState === 'in' && msuComp && oppComp) {
                const msuScore = msuComp.score?.value || msuComp.score || "0";
                const oppScore = oppComp.score?.value || oppComp.score || "0";
                resultStr = `LIVE ${msuScore}-${oppScore}`;
              }

              let timeStr = 'TBD';
              if (!isNaN(gameDate)) {
                timeStr = gameDate.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });
              }

              liveOrRecentGames.push({
                sportKey: sport.key,
                opponent: oppComp.team.displayName || oppComp.team.shortDisplayName || 'Opponent',
                dateObj: gameDate,
                isoDate: gameIso,
                timeStr: timeStr,
                isHome: msuComp.homeAway === 'home',
                tv: extractBroadcastNetwork(comp),
                result: resultStr,
                state: gameState,
                source: 'espn'
              });
            });
          }
        } catch (err) {
          console.log(`Failed fetching scores for ${sport.key}:`, err);
        }
      });

      await Promise.all(promises);

      // Merge data.js fallback entries (e.g. exhibition matches)
      if (typeof masterDataset !== 'undefined' && Array.isArray(masterDataset)) {
        masterDataset.forEach(localGame => {
          const gameDate = new Date(localGame.isoDate + 'T00:00:00');
          const gameDayAfter = new Date(localGame.isoDate + 'T11:00:00');
          gameDayAfter.setDate(gameDayAfter.getDate() + 1);

          if (localGame.result && localGame.result.trim() !== '' && now > gameDayAfter) {
            return; // Skip expired local result
          }

          const exists = liveOrRecentGames.some(
            g => g.sportKey === localGame.sportKey && g.isoDate === localGame.isoDate
          );

          if (!exists) {
            // Include if it's today, live, or recently completed before next day 11am
            if (isToday(gameDate) || (localGame.result && now <= gameDayAfter)) {
              liveOrRecentGames.push({
                ...localGame,
                dateObj: gameDate,
                state: localGame.result ? 'post' : 'pre',
                source: 'js'
              });
            }
          }
        });
      }

      // Filter to show active/recent display window (Today +/- recent)
      const relevantGames = liveOrRecentGames.filter(g => {
        const gameDayAfter = new Date(g.isoDate + 'T11:00:00');
        gameDayAfter.setDate(gameDayAfter.getDate() + 1);
        return g.state === 'in' || g.state === 'post' || isToday(g.dateObj) || (g.dateObj >= cutoff11amToday && g.dateObj <= new Date(now.getTime() + 86400000));
      });

      relevantGames.sort((a, b) => a.dateObj - b.dateObj);

      renderScores(relevantGames, container);
    }

    function isToday(date) {
      const today = new Date();
      return date.getDate() === today.getDate() &&
             date.getMonth() === today.getMonth() &&
             date.getFullYear() === today.getFullYear();
    }

    function renderScores(games, container) {
      container.innerHTML = "";

      if (games.length === 0) {
        container.innerHTML = "<p style='color: var(--subtext); font-size: 0.8rem;'>No live or recent games right now.</p>";
        return;
      }

      games.forEach(g => {
        const card = document.createElement("div");
        card.className = "score-card";

        let statusText = g.timeStr;
        let rightSideHtml = '';

        if (g.state === 'in') {
          statusText = '🔴 LIVE';
          const isWin = g.result.startsWith('LIVE W');
          rightSideHtml = `<span class="result-badge result-win">${g.result}</span>`;
        } else if (g.result) {
          statusText = 'Final';
          const isWin = g.result.startsWith('W');
          rightSideHtml = `<span class="result-badge ${isWin ? 'result-win' : 'result-loss'}">${g.result}</span>`;
        } else {
          statusText = g.timeStr;
          rightSideHtml = g.tv ? `<span class="tv-tag">📺 ${g.tv}</span>` : '';
        }

        card.innerHTML = `
          <div class="game-info">
            <span class="sport-tag">${sportLabels[g.sportKey] || 'Sport'}</span>
            <span class="matchup">${g.isHome ? 'vs' : '@'} ${g.opponent}</span>
            <span class="game-status">${statusText}</span>
          </div>
          <div class="score-right">
            ${rightSideHtml}
          </div>
        `;
        container.appendChild(card);
      });
    }

    window.onload = function() {
      loadScores();
    };
  </script>

</body>
</html>
