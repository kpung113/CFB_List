<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bully's CFB Game List</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --text: #f8fafc;
      --accent: #38bdf8;
      --live-red: #ef4444;
      --subtext: #94a3b8;
    }
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 16px;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      padding-bottom: 12px;
      border-bottom: 1px solid #334155;
    }
    h1 { margin: 0; font-size: 1.25rem; }
    .status-badge {
      font-size: 0.75rem;
      padding: 4px 8px;
      background: #334155;
      border-radius: 12px;
    }
    .game-card {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 12px;
      border-left: 4px solid transparent;
      box-shadow: 0 2px 8px rgba(0,0,0,0.2);
    }
    .game-card.live-4q { border-left-color: var(--live-red); }
    .game-card.live { border-left-color: var(--accent); }
    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.85rem;
      color: var(--subtext);
      margin-bottom: 8px;
    }
    .header-right {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .team-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 6px 0;
      font-size: 1.1rem;
      font-weight: 600;
    }
    .score { font-size: 1.25rem; font-weight: bold; }
    .drive-banner {
      font-size: 0.75rem;
      color: #38bdf8;
      background: rgba(56, 189, 248, 0.1);
      padding: 4px 8px;
      border-radius: 6px;
      margin: 8px 0;
      font-weight: 600;
    }
    .last-play {
      font-size: 0.72rem;
      color: var(--subtext);
      font-style: italic;
      margin: 4px 0 8px 0;
      line-height: 1.2;
    }
    .game-meta {
      font-size: 0.75rem;
      color: var(--subtext);
      margin-top: 8px;
      padding-top: 6px;
      border-top: 1px solid #334155;
      display: flex;
      justify-content: space-between;
    }
    .watch-btn {
      color: #ef4444;
      text-decoration: none;
      font-weight: bold;
      font-size: 0.75rem;
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.3);
      padding: 2px 6px;
      border-radius: 4px;
      display: inline-flex;
      align-items: center;
      gap: 2px;
      transition: background 0.2s;
    }
    .watch-btn:active {
      background: rgba(239, 68, 68, 0.35);
    }
  </style>
</head>
<body>

  <header>
    <h1>🏈 Bully's CFB Game List</h1>
    <span id="update-status" class="status-badge">Loading...</span>
  </header>

  <div id="games-container"></div>

  <script>
    async function fetchScores() {
      const statusElement = document.getElementById("update-status");
      statusElement.innerText = "Refreshing...";
      
      try {
        const response = await fetch("https://site.api.espn.com/apis/site/v2/sports/football/college-football/scoreboard?groups=80&limit=300");
        const data = await response.json();
        
        const games = data.events.map(event => {
          const comp = event.competitions[0];
          const home = comp.competitors.find(c => c.homeAway === 'home');
          const away = comp.competitors.find(c => c.homeAway === 'away');
          
          const statusState = event.status.type.state; 
          const period = event.status.period;
          const homeScore = parseInt(home.score || "0");
          const awayScore = parseInt(away.score || "0");
          const diff = Math.abs(homeScore - awayScore);

          const isSecGame = (home.team.conferenceId === "8" || away.team.conferenceId === "8");
          
          // Check for Top 25 Ranking
          const homeRankNum = home.curatedRank && home.curatedRank.current;
          const awayRankNum = away.curatedRank && away.curatedRank.current;
          const hasRankedTeam = (homeRankNum && homeRankNum <= 25) || (awayRankNum && awayRankNum <= 25);

          // Helper to get formatted rank prefix
          const getRank = (c) => {
            const r = c.curatedRank && c.curatedRank.current;
            return (r && r <= 25) ? `<span style="color:#fbbf24; font-weight:bold;">#${r}</span> ` : '';
          };

          // Broadcast Network
          const tvNetwork = (comp.broadcasts && comp.broadcasts.length > 0 && comp.broadcasts[0].names)
            ? comp.broadcasts[0].names[0] 
            : "TV TBD";

          // Robust Betting Spread Extraction
          let spread = '';
          if (comp.odds && comp.odds.length > 0) {
            const oddsObj = comp.odds[0];
            if (oddsObj.details && oddsObj.details !== 'null' && oddsObj.details !== 'EVEN') {
              spread = oddsObj.details;
            } else if (oddsObj.summary) {
              spread = oddsObj.summary;
            }
          }

          // Live Situation & Drive Tracking
          const situation = comp.situation;
          let possessionTeamId = null;
          let driveText = '';
          let lastPlayText = '';

          if (statusState === 'in' && situation) {
            possessionTeamId = situation.possession;

            const down = situation.down;
            const distance = situation.distance;
            const posText = situation.possessionText || '';

            let downText = '';
            if (situation.downText && !situation.downText.includes('-1')) {
              downText = situation.downText;
            } else if (down && down > 0 && distance && distance > 0) {
              downText = `${down} & ${distance}`;
            }
            
            if (downText || (posText && !posText.includes('-1'))) {
              driveText = `${downText}${downText && posText ? ' at ' : ''}${posText}`;
            }

            if (situation.lastPlay && situation.lastPlay.text) {
              lastPlayText = situation.lastPlay.text;
            }
          }

          // Win Probability Calculation
          let winProbText = '';
          if (situation && situation.lastPlay && situation.lastPlay.probability) {
            const prob = situation.lastPlay.probability;
            const homeWp = Math.round(prob.homeWinPercentage * 100);
            const awayWp = 100 - homeWp;
            if (homeWp >= awayWp) {
              winProbText = `${home.team.abbreviation || 'HOME'} ${homeWp}%`;
            } else {
              winProbText = `${away.team.abbreviation || 'AWAY'} ${awayWp}%`;
            }
          } else if (situation && typeof situation.homeWinPercentage !== 'undefined') {
            const homeWp = Math.round(situation.homeWinPercentage * 100);
            const awayWp = 100 - homeWp;
            if (homeWp >= awayWp) {
              winProbText = `${home.team.abbreviation || 'HOME'} ${homeWp}%`;
            } else {
              winProbText = `${away.team.abbreviation || 'AWAY'} ${awayWp}%`;
            }
          }

          let priority = 0;
          const isCloseFourthQuarter = (statusState === 'in' && period >= 4 && diff < 15);

          if (statusState === 'pre') {
            priority += 1000;
            if (isSecGame) priority += 200;

          } else if (statusState === 'post') {
            priority += 0;

          } else if (statusState === 'in') {
            priority += 20000;

            if (isCloseFourthQuarter) {
              priority += 10000;
              priority += (15 - diff) * 100;

            } else if (isSecGame) {
              priority += 5000;
              priority += (period * 500);
              priority += Math.max(0, (35 - diff) * 50);

            } else if (hasRankedTeam) {
              priority += 2500;
              priority += (period * 400);
              priority += Math.max(0, (35 - diff) * 50);

            } else {
              let periodMultiplier = 1.0;
              if (period === 3) periodMultiplier = 1.3;
              if (period === 2) periodMultiplier = 1.1;
              if (period === 1) periodMultiplier = 1.0;

              const rawCloseness = Math.max(0, (35 - diff) * 100);
              priority += Math.round(rawCloseness * periodMultiplier);
            }
          }

          return {
            gameId: event.id,
            homeId: home.id,
            awayId: away.id,
            homeTeam: home.team.shortDisplayName || home.team.name,
            awayTeam: away.team.shortDisplayName || away.team.name,
            homeRank: getRank(home),
            awayRank: getRank(away),
            homeScore,
            awayScore,
            statusState,
            statusDetail: event.status.type.shortDetail,
            period,
            diff,
            isSecGame,
            tvNetwork,
            spread,
            winProbText,
            possessionTeamId,
            driveText,
            lastPlayText,
            priority
          };
        });

        games.sort((a, b) => b.priority - a.priority);
        renderGames(games);
        statusElement.innerText = "Live • 30s";
      } catch (err) {
        statusElement.innerText = "Error Loading";
      }
    }

    function renderGames(games) {
      const container = document.getElementById("games-container");
      container.innerHTML = "";

      if (games.length === 0) {
        container.innerHTML = "<p>No games found today.</p>";
        return;
      }

      games.forEach(game => {
        const card = document.createElement("div");
        card.className = "game-card";
        if (game.statusState === 'in' && game.period >= 4) {
          card.classList.add("live-4q");
        } else if (game.statusState === 'in') {
          card.classList.add("live");
        }

        const isAwayPossession = (game.possessionTeamId && game.possessionTeamId === game.awayId);
        const isHomePossession = (game.possessionTeamId && game.possessionTeamId === game.homeId);

        card.innerHTML = `
          <div class="card-header">
            <span>${game.statusDetail} ${game.isSecGame ? '<strong style="color:#38bdf8;">[SEC]</strong>' : ''}</span>
            <span class="header-right">
              <strong style="color:#fbbf24;">📺 ${game.tvNetwork}</strong>
              <a href="https://www.espn.com/watch/player/_/id/${game.gameId}" 
                 target="_blank" 
                 rel="noopener noreferrer" 
                 class="watch-btn">
                ▶ Watch
              </a>
              ${game.statusState === 'in' ? `| Diff: ${game.diff} pts` : ''}
            </span>
          </div>
          <div class="team-row">
            <span>${isAwayPossession ? '🏈 ' : ''}${game.awayRank}${game.awayTeam}</span>
            <span class="score">${game.awayScore}</span>
          </div>
          <div class="team-row">
            <span>${isHomePossession ? '🏈 ' : ''}${game.homeRank}${game.homeTeam}</span>
            <span class="score">${game.homeScore}</span>
          </div>
          ${game.driveText ? `<div class="drive-banner">📍 Drive: ${game.driveText}</div>` : ''}
          ${game.lastPlayText ? `<div class="last-play"><strong>Last Play:</strong> ${game.lastPlayText}</div>` : ''}
          ${(game.spread || game.winProbText) ? `
          <div class="game-meta">
            <span>${game.spread ? `<strong>Line:</strong> ${game.spread}` : ''}</span>
            <span>${game.winProbText ? `<strong>Win Prob:</strong> ${game.winProbText}` : ''}</span>
          </div>
          ` : ''}
        `;
        container.appendChild(card);
      });
    }

    fetchScores();
    setInterval(fetchScores, 30000);
  </script>

</body>
</html>
