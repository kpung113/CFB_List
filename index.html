<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mississippi State Scores & Dashboard</title>
  <style>
    :root {
      --bg: #0b0c10;
      --card-bg: #181920;
      --card-border: #272935;
      --text: #f8fafc;
      --accent-maroon: #5d1725;
      --subtext: #94a3b8;
      --gold: #fbbf24;
      --win-green: #22c55e;
      --loss-red: #ef4444;
    }
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 12px;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 12px;
      padding-bottom: 8px;
      border-bottom: 2px solid var(--accent-maroon);
    }
    .header-title {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .msu-logo {
      height: 32px;
      width: auto;
      object-fit: contain;
      filter: 
        drop-shadow( 2px  0px 0px #ffffff)
        drop-shadow(-2px  0px 0px #ffffff)
        drop-shadow( 0px  2px 0px #ffffff)
        drop-shadow( 0px -2px 0px #ffffff);
    }
    h1 { margin: 0; font-size: 1rem; font-weight: 800; letter-spacing: -0.5px; }
    .nav-tabs {
      display: flex;
      gap: 6px;
    }
    .nav-tabs a {
      color: var(--subtext);
      text-decoration: none;
      font-size: 0.75rem;
      font-weight: 700;
      padding: 4px 8px;
      background: #181920;
      border: 1px solid var(--card-border);
      border-radius: 6px;
      transition: all 0.2s;
    }
    .nav-tabs a.active, .nav-tabs a:hover {
      color: #fff;
      background: var(--accent-maroon);
      border-color: #7d2033;
    }

    .dashboard-section-title {
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--gold);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 8px;
      margin-top: 4px;
    }

    .score-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      padding: 10px 12px;
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 2px 6px rgba(0,0,0,0.3);
    }
    .game-left {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .sport-tag {
      font-size: 0.65rem;
      color: var(--gold);
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .game-date {
      font-size: 0.7rem;
      color: var(--subtext);
      font-weight: 600;
    }
    .opponent-name {
      font-size: 0.9rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .game-right {
      text-align: right;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 2px;
    }
    .result-badge {
      font-weight: 800;
      font-size: 0.8rem;
      padding: 2px 6px;
      border-radius: 4px;
      display: inline-block;
    }
    .result-win { background: rgba(34, 197, 94, 0.2); color: var(--win-green); border: 1px solid rgba(34, 197, 94, 0.4); }
    .result-loss { background: rgba(239, 68, 68, 0.2); color: var(--loss-red); border: 1px solid rgba(239, 68, 68, 0.4); }
    .tv-tag {
      font-size: 0.65rem;
      color: var(--subtext);
    }
  </style>
</head>
<body>

  <header>
    <div class="header-title">
      <img src="https://a.espncdn.com/combiner/i?img=/i/teamlogos/ncaa/500/344.png&h=100&w=100" 
           alt="MSU Logo" 
           class="msu-logo">
      <h1>MSU Dashboard</h1>
    </div>
    <nav class="nav-tabs">
      <a href="index.html" class="active">Scores</a>
      <a href="schedules.html">MSU Schedule</a>
      <a href="visit.html">MSU Trip</a>
    </nav>
  </header>

  <div class="dashboard-section-title">Recent & Upcoming Games</div>
  <div id="scores-container">Loading dashboard...</div>

  <!-- Include centralized dataset -->
  <script src="data.js"></script>

  <script>
    const sportLabels = {
      'football': 'Football',
      'mens-basketball': 'Men\'s Basketball',
      'womens-basketball': 'Women\'s Basketball',
      'baseball': 'Baseball'
    };

    function renderDashboard() {
      const container = document.getElementById("scores-container");
      if (!container) return;
      container.innerHTML = "";

      if (typeof masterDataset === 'undefined' || !masterDataset.length) {
        container.innerHTML = "<p style='color:var(--subtext);'>Unable to load data from data.js.</p>";
        return;
      }

      const now = new Date();

      // Sort dataset: Active/upcoming first, completed games drop to bottom past noon the next day
      masterDataset.sort((a, b) => {
        const getDropDeadline = (isoDate) => {
          const gameDate = new Date(isoDate + 'T00:00:00');
          gameDate.setDate(gameDate.getDate() + 1);
          gameDate.setHours(12, 0, 0, 0);
          return gameDate;
        };

        const deadlineA = getDropDeadline(a.isoDate);
        const deadlineB = getDropDeadline(b.isoDate);

        const isPastA = now > deadlineA;
        const isPastB = now > deadlineB;

        if (isPastA !== isPastB) {
          return isPastA ? 1 : -1;
        }

        return new Date(a.isoDate) - new Date(b.isoDate);
      });

      masterDataset.forEach(ev => {
        const gameDate = new Date(ev.isoDate + 'T00:00:00');
        const dateFormatted = gameDate.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });

        let rightSideHtml = '';
        if (ev.result) {
          const isWin = ev.result.startsWith('W');
          rightSideHtml = `<span class="result-badge ${isWin ? 'result-win' : 'result-loss'}">${ev.result}</span>`;
        } else {
          rightSideHtml = `<span class="game-date">${ev.timeStr}</span>`;
        }

        const tvInfo = ev.tv ? `<span class="tv-tag">${ev.tv}</span>` : '';

        const card = document.createElement("div");
        card.className = "score-card";
        card.innerHTML = `
          <div class="game-left">
            <span class="sport-tag">${sportLabels[ev.sportKey]}</span>
            <span class="game-date">${dateFormatted}</span>
            <div class="opponent-name">
              <span style="color:var(--subtext); font-size:0.75rem;">${ev.isHome ? 'vs' : '@'}</span>
              ${ev.opponent}
            </div>
          </div>
          <div class="game-right">
            ${rightSideHtml}
            ${tvInfo}
          </div>
        `;
        container.appendChild(card);
      });
    }

    window.onload = function() {
      try {
        renderDashboard();
      } catch (err) {
        const container = document.getElementById("scores-container");
        if (container) container.innerHTML = "<p style='color:var(--subtext);'>Error loading scores dashboard.</p>";
      }
    };
  </script>

</body>
</html>
