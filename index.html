<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bully's CFB Game List</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --text: #f8fafc;
      --accent: #38bdf8;
      --live-red: #ef4444;
      --subtext: #94a3b8;
    }
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 16px;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      padding-bottom: 12px;
      border-bottom: 1px solid #334155;
    }
    h1 { margin: 0; font-size: 1.25rem; }
    .status-badge {
      font-size: 0.75rem;
      padding: 4px 8px;
      background: #334155;
      border-radius: 12px;
    }
    .game-card {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 12px;
      border-left: 4px solid transparent;
      box-shadow: 0 2px 8px rgba(0,0,0,0.2);
    }
    .game-card.live-4q { border-left-color: var(--live-red); }
    .game-card.live { border-left-color: var(--accent); }
    .card-header {
      display: flex;
      justify-content: space-between;
      font-size: 0.85rem;
      color: var(--subtext);
      margin-bottom: 8px;
    }
    .team-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 6px 0;
      font-size: 1.1rem;
      font-weight: 600;
    }
    .score { font-size: 1.25rem; font-weight: bold; }
    .game-meta {
      font-size: 0.75rem;
      color: var(--subtext);
      margin-top: 8px;
      padding-top: 6px;
      border-top: 1px solid #334155;
      display: flex;
      justify-content: space-between;
    }
  </style>
</head>
<body>

  <header>
    <h1>🏈 Bully's CFB Game List</h1>
    <span id="update-status" class="status-badge">Loading...</span>
  </header>

  <div id="games-container"></div>

  <script>
    async function fetchScores() {
      const statusElement = document.getElementById("update-status");
      statusElement.innerText = "Refreshing...";
      
      try {
        const response = await fetch("https://site.api.espn.com/apis/site/v2/sports/football/college-football/scoreboard?groups=80&limit=300");
        const data = await response.json();
        
        const games = data.events.map(event => {
          const comp = event.competitions[0];
          const home = comp.competitors.find(c => c.homeAway === 'home');
          const away = comp.competitors.find(c => c.homeAway === 'away');
          
          const statusState = event.status.type.state; 
          const period = event.status.period;
          const homeScore = parseInt(home.score || "0");
          const awayScore = parseInt(away.score || "0");
          const diff = Math.abs(homeScore - awayScore);

          const isSecGame = (home.team.conferenceId === "8" || away.team.conferenceId === "8");
          
          // Helper to get formatted rank prefix
          const getRank = (c) => {
            const r = c.curatedRank && c.curatedRank.current;
            return (r && r <= 25) ? `<span style="color:#fbbf24; font-weight:bold;">#${r}</span> ` : '';
          };

          // Broadcast Network
          const tvNetwork = (comp.broadcasts && comp.broadcasts.length > 0 && comp.broadcasts[0].names)
            ? comp.broadcasts[0].names[0] 
            : "TV TBD";

          // Robust Betting Spread Extraction
          let spread = '';
          if (comp.odds && comp.odds.length > 0) {
            const oddsObj = comp.odds[0];
            if (oddsObj.details && oddsObj.details !== 'null' && oddsObj.details !== 'EVEN') {
              spread = oddsObj.details;
            } else if (oddsObj.summary) {
              spread = oddsObj.summary;
            }
          }

          // Win Probability Calculation
          let winProbText = '';
          const situation = comp.situation;
          if (situation && situation.lastPlay && situation.lastPlay.probability) {
            const prob = situation.lastPlay.probability;
            const homeWp = Math.round(prob.homeWinPercentage * 100);
            const awayWp = 100 - homeWp;
            if (homeWp >= awayWp) {
              winProbText = `${home.team.abbreviation || 'HOME'} ${homeWp}%`;
            } else {
              winProbText = `${away.team.abbreviation || 'AWAY'} ${awayWp}%`;
            }
          } else if (situation && typeof situation.homeWinPercentage !== 'undefined') {
            const homeWp = Math.round(situation.homeWinPercentage * 100);
            const awayWp = 100 - homeWp;
            if (homeWp >= awayWp) {
              winProbText = `${home.team.abbreviation || 'HOME'} ${homeWp}%`;
            } else {
              winProbText = `${away.team.abbreviation || 'AWAY'} ${awayWp}%`;
            }
          }

          let priority = 0;
          const isCloseFourthQuarter = (statusState === 'in' && period >= 4 && diff < 15);

          if (statusState === 'pre') {
            priority += 1000;
            if (isSecGame) priority += 200;

          } else if (statusState === 'post') {
            priority += 0;

          } else if (statusState === 'in') {
                      } else if (statusState === 'in') {
            priority += 20000; // Live games baseline

            // Check if either team is ranked in the AP/CFP Top 25
            const homeRank = home.curatedRank && home.curatedRank.current;
            const awayRank = away.curatedRank && away.curatedRank.current;
            const hasRankedTeam = (homeRank && homeRank <= 25) || (awayRank && awayRank <= 25);

            if (isCloseFourthQuarter) {
              // TIER 1: Close 4th quarter games get absolute top priority
              priority += 10000;
              priority += (15 - diff) * 100;

            } else if (isSecGame) {
              // TIER 2: SEC live games
              priority += 5000;
              priority += (period * 500);
              priority += Math.max(0, (35 - diff) * 50);

            } else if (hasRankedTeam) {
              // TIER 2.5 (NEW): Non-SEC Live Games with Ranked Teams
              priority += 2500;
              priority += (period * 400);
              priority += Math.max(0, (35 - diff) * 50);

            } else {
              // TIER 3: Standard live non-SEC, unranked games
              let periodMultiplier = 1.0;
              if (period === 3) periodMultiplier = 1.3;
              if (period === 2) periodMultiplier = 1.1;
              if (period === 1) periodMultiplier = 1.0;

              const rawCloseness = Math.max(0, (35 - diff) * 100);
              priority += Math.round(rawCloseness * periodMultiplier);
            }
          }
          

          return {
            homeTeam: home.team.shortDisplayName || home.team.name,
            awayTeam: away.team.shortDisplayName || away.team.name,
            homeRank: getRank(home),
            awayRank: getRank(away),
            homeScore,
            awayScore,
            statusState,
            statusDetail: event.status.type.shortDetail,
            period,
            diff,
            isSecGame,
            tvNetwork,
            spread,
            winProbText,
            priority
          };
        });

        games.sort((a, b) => b.priority - a.priority);
        renderGames(games);
        statusElement.innerText = "Live • 30s";
      } catch (err) {
        statusElement.innerText = "Error Loading";
      }
    }

    function renderGames(games) {
      const container = document.getElementById("games-container");
      container.innerHTML = "";

      if (games.length === 0) {
        container.innerHTML = "<p>No games found today.</p>";
        return;
      }

      games.forEach(game => {
        const card = document.createElement("div");
        card.className = "game-card";
        if (game.statusState === 'in' && game.period >= 4) {
          card.classList.add("live-4q");
        } else if (game.statusState === 'in') {
          card.classList.add("live");
        }

        card.innerHTML = `
          <div class="card-header">
            <span>${game.statusDetail} ${game.isSecGame ? '<strong style="color:#38bdf8;">[SEC]</strong>' : ''}</span>
            <span><strong style="color:#fbbf24;">📺 ${game.tvNetwork}</strong> ${game.statusState === 'in' ? `| Diff: ${game.diff} pts` : ''}</span>
          </div>
          <div class="team-row">
            <span>${game.awayRank}${game.awayTeam}</span>
            <span class="score">${game.awayScore}</span>
          </div>
          <div class="team-row">
            <span>${game.homeRank}${game.homeTeam}</span>
            <span class="score">${game.homeScore}</span>
          </div>
          ${(game.spread || game.winProbText) ? `
          <div class="game-meta">
            <span>${game.spread ? `<strong>Line:</strong> ${game.spread}` : ''}</span>
            <span>${game.winProbText ? `<strong>Win Prob:</strong> ${game.winProbText}` : ''}</span>
          </div>
          ` : ''}
        `;
        container.appendChild(card);
      });
    }

    fetchScores();
    setInterval(fetchScores, 30000);
  </script>

</body>
</html>
